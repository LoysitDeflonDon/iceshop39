<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель ICESHOP39</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            background: #0A0F1E;
            color: #EDF2FF;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            color: #3B82F6;
            margin-bottom: 20px;
        }
        .login-section {
            max-width: 400px;
            margin: 100px auto;
            background: #111827;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #1F2A44;
            text-align: center;
        }
        .login-section input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #1E293B;
            border: 1px solid #1F2A44;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        .login-section button {
            background: #3B82F6;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .category-btn {
            padding: 10px 20px;
            background: #1E293B;
            border: 1px solid #1F2A44;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-btn.active {
            background: #3B82F6;
            border-color: #3B82F6;
        }
        .product-form {
            background: #111827;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #1F2A44;
        }
        .product-form input, .product-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #1E293B;
            border: 1px solid #1F2A44;
            border-radius: 8px;
            color: white;
        }
        .product-form textarea {
            resize: vertical;
            min-height: 60px;
        }
        .flavor-item {
            background: #1E293B;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }
        @media (max-width: 700px) {
            .flavor-item {
                grid-template-columns: 1fr;
            }
        }
        button {
            background: #3B82F6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        button.danger { background: #EF4444; }
        button.success { background: #10B981; }
        .products-list {
            display: grid;
            gap: 15px;
        }
        .product-item {
            background: #111827;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10B981;
            padding: 12px 24px;
            border-radius: 10px;
            z-index: 1000;
        }
        .loading { text-align: center; padding: 50px; color: #94A3B8; }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #111827;
            border-radius: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .github-link {
            color: #3B82F6;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Форма входа -->
    <div id="loginSection" class="login-section">
        <h2>🔐 Админ-панель</h2>
        <p>Введите пароль для управления товарами</p>
        <input type="password" id="adminPassword" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <p style="margin-top:15px; font-size:0.8rem; color:#94A3B8;">Пароль: admin123</p>
    </div>
    
    <!-- Админ-панель -->
    <div id="adminPanel" class="hidden">
        <div class="user-info">
            <div class="header-info">
                <span>👤 Администратор</span>
                <a href="https://github.com/LoysitDeflonDon/iceshop39-data" target="_blank" class="github-link">📁 Данные на GitHub</a>
            </div>
            <button id="logoutBtn" class="danger">Выйти</button>
        </div>
        
        <h1>🛠️ Админ-панель ICESHOP39</h1>
        
        <!-- Выбор категории -->
        <div class="category-buttons" id="categoryButtons"></div>
        
        <!-- Форма добавления/редактирования товара -->
        <div class="product-form">
            <h3 id="formTitle">➕ Добавить товар</h3>
            <input type="text" id="productId" placeholder="ID (число)" readonly style="background:#334155;">
            <input type="text" id="productName" placeholder="Название товара" required>
            <input type="text" id="productImage" placeholder="URL картинки (i.ibb.co или другая)" required>
            <textarea id="productDesc" placeholder="Описание товара (например: Аккумулятор: 1200 мАч | Мощность: 30 Вт)"></textarea>
            
            <div style="margin: 15px 0;">
                <strong>🎨 Варианты товара (цвета/вкусы):</strong>
                <div id="flavorsContainer"></div>
                <button type="button" id="addFlavorBtn" style="background:#334155; margin-top:10px;">+ Добавить вариант</button>
            </div>
            
            <div style="margin-top: 15px;">
                <button id="saveProductBtn" class="success">💾 Сохранить товар</button>
                <button id="cancelEditBtn" class="danger hidden">Отмена</button>
            </div>
        </div>
        
        <!-- Список товаров -->
        <h3>📦 Список товаров</h3>
        <div id="productsList" class="products-list"><div class="loading">Загрузка...</div></div>
    </div>
</div>

<script>
// ========== НАСТРОЙКИ ==========
const ADMIN_PASSWORD = "admin123";  // Поменяй на свой пароль!
const REPO_OWNER = "LoysitDeflonDon";
const REPO_NAME = "iceshop39-data";
const BRANCH = "main";

// Категории (имя файла и русское название)
const categories = [
    { file: "Zhitkosty", name: "Жидкости", icon: "💧" },
    { file: "Snus", name: "Снюс", icon: "👅" },
    { file: "Vapes", name: "Вейпы", icon: "💨" },
    { file: "Ispariteli", name: "Испарители", icon: "🔥" },
    { file: "Kartdritzhy", name: "Картриджи", icon: "⚡" },
    { file: "Odnorazki", name: "Одноразки", icon: "🔄" }
];

// Глобальные переменные
let currentCategory = null;
let currentProducts = [];
let editingProductId = null;
let currentFlavors = [];
let githubToken = null;

// ========== ФУНКЦИИ ВХОДА ==========
function showToast(msg, isError = false) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? '#EF4444' : '#10B981';
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
        toast.style.background = '#10B981';
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

// ========== ЗАГРУЗКА ТОВАРОВ ==========
async function loadProducts() {
    if (!currentCategory) return;
    document.getElementById('productsList').innerHTML = '<div class="loading">Загрузка...</div>';
    const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${currentCategory}.json`;
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Файл не найден');
        const text = await res.text();
        let clean = text.trim();
        if (clean.startsWith('\uFEFF')) clean = clean.substring(1);
        currentProducts = JSON.parse(clean);
        renderProductsList();
    } catch(e) {
        console.error(e);
        currentProducts = [];
        renderProductsList();
    }
}

function renderProductsList() {
    const container = document.getElementById('productsList');
    if (!currentProducts.length) {
        container.innerHTML = '<div class="loading">📭 Нет товаров. Добавьте первый!</div>';
        return;
    }
    container.innerHTML = currentProducts.map(product => `
        <div class="product-item">
            <div>
                <strong>${escapeHtml(product.name)}</strong>
                <div style="font-size:0.8rem; color:#94A3B8;">
                    ID: ${product.id} | 
                    ${product.flavors ? '🎨 ' + product.flavors.length + ' вариантов' : '💰 ' + product.price + ' ₽'}
                </div>
                ${product.desc ? `<div style="font-size:0.7rem; color:#64748B; margin-top:5px;">${escapeHtml(product.desc.substring(0, 80))}${product.desc.length > 80 ? '...' : ''}</div>` : ''}
            </div>
            <div>
                <button onclick="editProduct(${product.id})" style="margin-right:5px;">✏️</button>
                <button class="danger" onclick="deleteProduct(${product.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

// ========== РЕДАКТИРОВАНИЕ ==========
window.editProduct = function(id) {
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;
    
    editingProductId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('productId').value = product.id;
    document.getElementById('productName').value = product.name;
    document.getElementById('productImage').value = product.image || '';
    document.getElementById('productDesc').value = product.desc || '';
    
    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price || 0, stock: product.stock || 0 }];
    }
    renderFlavorsForm();
    document.getElementById('cancelEditBtn').classList.remove('hidden');
}

function renderFlavorsForm() {
    const container = document.getElementById('flavorsContainer');
    if (!currentFlavors.length) {
        container.innerHTML = '<div style="padding:10px; background:#1E293B; border-radius:8px;">Нет вариантов. Нажмите "+ Добавить вариант"</div>';
        return;
    }
    container.innerHTML = currentFlavors.map((flavor, idx) => `
        <div class="flavor-item">
            <input type="text" placeholder="Название (цвет/вкус)" value="${escapeHtml(flavor.name)}" data-idx="${idx}" data-field="name" style="flex:2;">
            <input type="number" placeholder="Цена" value="${flavor.price}" data-idx="${idx}" data-field="price">
            <input type="number" placeholder="Остаток" value="${flavor.stock}" data-idx="${idx}" data-field="stock">
            <button class="danger" onclick="removeFlavor(${idx})">❌ Удалить</button>
        </div>
    `).join('');
    
    document.querySelectorAll('#flavorsContainer input').forEach(input => {
        input.addEventListener('change', (e) => {
            const idx = parseInt(input.dataset.idx);
            const field = input.dataset.field;
            const value = input.type === 'number' ? parseInt(input.value) : input.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = value;
        });
    });
}

window.addFlavor = function() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavorsForm();
}

window.removeFlavor = function(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavorsForm();
}

// ========== СОХРАНЕНИЕ НА GITHUB ==========
async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const image = document.getElementById('productImage').value.trim();
    const desc = document.getElementById('productDesc').value;
    
    if (!name) {
        showToast("❌ Введите название товара!", true);
        return;
    }
    if (!image) {
        showToast("❌ Введите URL картинки!", true);
        return;
    }
    if (!currentFlavors.length || currentFlavors.every(f => !f.name)) {
        showToast("❌ Добавьте хотя бы один вариант (цвет/вкус)!", true);
        return;
    }
    
    // Запрашиваем GitHub токен (один раз за сессию)
    if (!githubToken) {
        githubToken = prompt("🔐 Введите GitHub токен для сохранения:\n(Создать: github.com/settings/tokens → repo)");
        if (!githubToken) {
            showToast("❌ Токен обязателен для сохранения!", true);
            return;
        }
    }
    
    let newProduct;
    const categoryName = categories.find(c => c.file === currentCategory)?.name || currentCategory;
    
    if (editingProductId) {
        newProduct = currentProducts.find(p => p.id === editingProductId);
        newProduct.name = name;
        newProduct.image = image;
        newProduct.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete newProduct.flavors;
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
            delete newProduct.price;
            delete newProduct.stock;
        }
    } else {
        const newId = Math.max(...currentProducts.map(p => p.id), 0) + 1;
        newProduct = {
            id: newId,
            name: name,
            category: categoryName,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        currentProducts.push(newProduct);
    }
    
    await saveToGitHub(currentProducts);
    resetForm();
    loadProducts();
    showToast("✅ Товар сохранён! Через 1-2 минуты он появится на сайте");
}

async function saveToGitHub(products) {
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentCategory}.json`;
    let sha = "";
    
    try {
        const getRes = await fetch(url, {
            headers: { 'Authorization': `token ${githubToken}` }
        });
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }
    } catch(e) {}
    
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 4)));
    const body = {
        message: editingProductId ? `Update ${currentCategory}.json` : `Add product to ${currentCategory}.json`,
        content: content,
        branch: BRANCH
    };
    if (sha) body.sha = sha;
    
    const res = await fetch(url, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${githubToken}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });
    
    if (!res.ok) {
        const err = await res.json();
        if (err.message === "Bad credentials") {
            githubToken = null;
            showToast("❌ Токен недействителен! Введите новый", true);
        }
        throw new Error(err.message);
    }
}

window.deleteProduct = async function(id) {
    if (!confirm("Удалить товар? Это действие нельзя отменить!")) return;
    
    if (!githubToken) {
        githubToken = prompt("🔐 Введите GitHub токен для удаления:");
        if (!githubToken) return;
    }
    
    currentProducts = currentProducts.filter(p => p.id !== id);
    await saveToGitHub(currentProducts);
    loadProducts();
    showToast("🗑️ Товар удалён");
}

function resetForm() {
    editingProductId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Добавить товар';
    document.getElementById('productId').value = '';
    document.getElementById('productName').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('flavorsContainer').innerHTML = '';
    document.getElementById('cancelEditBtn').classList.add('hidden');
}

// ========== ЗАГРУЗКА КАТЕГОРИЙ ==========
function renderCategories() {
    const container = document.getElementById('categoryButtons');
    container.innerHTML = categories.map(cat => `
        <div class="category-btn" data-category="${cat.file}">
            ${cat.icon} ${cat.name}
        </div>
    `).join('');
    
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.category;
            resetForm();
            loadProducts();
        });
    });
}

// ========== ВХОД/ВЫХОД ==========
document.getElementById('loginBtn').addEventListener('click', () => {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === ADMIN_PASSWORD) {
        localStorage.setItem('admin_logged', 'true');
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        renderCategories();
    } else {
        showToast("❌ Неверный пароль!", true);
    }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('admin_logged');
    githubToken = null;
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('adminPassword').value = '';
});

// Проверка при загрузке
if (localStorage.getItem('admin_logged') === 'true') {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    renderCategories();
}

// Кнопки формы
document.getElementById('addFlavorBtn').addEventListener('click', addFlavor);
document.getElementById('saveProductBtn').addEventListener('click', saveProduct);
document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
</script>
</body>
</html>
