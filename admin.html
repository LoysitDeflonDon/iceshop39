<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Админ-панель ICESHOP39</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #0A0F1E; 
            color: #EDF2FF; 
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; 
            padding: 12px;
            padding-bottom: 30px;
        }

        .login-box { 
            max-width: 350px; 
            margin: 80px auto; 
            background: #111827; 
            padding: 28px; 
            border-radius: 28px; 
            text-align: center; 
            border: 1px solid #1F2A44;
        }

        .login-box h2 { margin-bottom: 20px; color: #3B82F6; }
        .login-box input { 
            width: 100%; 
            padding: 14px; 
            margin: 15px 0; 
            background: #1E293B; 
            border: 1px solid #334155; 
            border-radius: 14px; 
            color: white; 
            font-size: 16px; 
        }
        .login-box button { 
            background: #3B82F6; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            font-size: 16px;
            transition: all 0.2s;
        }

        .admin-panel { display: none; max-width: 1400px; margin: 0 auto; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1F2A44;
        }
        .admin-header h1 { font-size: 1.5rem; color: #3B82F6; }
        .logout-btn { background: #EF4444; padding: 8px 20px; border-radius: 40px; font-size: 14px; }

        .categories-wrapper {
            overflow-x: auto;
            margin: 15px 0;
            -webkit-overflow-scrolling: touch;
        }
        .category-buttons { display: flex; gap: 10px; flex-wrap: nowrap; padding-bottom: 8px; }
        .category-btn { 
            background: #1E293B; 
            padding: 10px 20px; 
            border-radius: 40px; 
            cursor: pointer; 
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid #334155;
        }
        .category-btn.active { background: #3B82F6; border-color: #3B82F6; }

        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #111827;
            padding: 12px 20px;
            border-radius: 20px;
            flex: 1;
            min-width: 100px;
            text-align: center;
            border: 1px solid #1F2A44;
        }
        .stat-number { font-size: 1.6rem; font-weight: bold; color: #3B82F6; }
        .stat-label { font-size: 0.7rem; color: #94A3B8; }

        .clear-stats-btn {
            background: #EF4444;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .product-form {
            background: #111827;
            padding: 20px;
            border-radius: 24px;
            margin: 20px 0;
            border: 1px solid #1F2A44;
        }

        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-row input, .form-row textarea { flex: 1; min-width: 150px; }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            background: #1E293B; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            color: white; 
            font-size: 14px;
        }
        textarea { resize: vertical; min-height: 70px; font-family: inherit; }

        .image-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin: 12px 0;
        }
        .image-row input { flex: 1; margin: 0; }
        .image-row button { background: #334155; width: auto; padding: 12px 16px; margin: 0; white-space: nowrap; }
        .image-preview { margin-top: 10px; }
        .image-preview img { max-width: 80px; max-height: 80px; border-radius: 12px; }

        .flavors-list { margin: 15px 0; }
        .flavor-row {
            background: #1E293B;
            padding: 12px;
            margin: 10px 0;
            border-radius: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .flavor-row input { flex: 1; min-width: 100px; margin: 0; }
        .flavor-row button { background: #EF4444; width: auto; padding: 10px 16px; }

        button { 
            background: #3B82F6; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 12px; 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        button.danger { background: #EF4444; }
        button.success { background: #10B981; }
        button.secondary { background: #334155; }

        .action-buttons { display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .action-buttons button { flex: 1; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .product-card {
            background: #111827;
            padding: 14px;
            border-radius: 20px;
            border: 1px solid #1F2A44;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .product-info { flex: 1; }
        .product-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .product-meta { font-size: 11px; color: #94A3B8; }
        .product-actions { display: flex; gap: 8px; }
        .product-actions button { padding: 8px 12px; font-size: 12px; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10B981;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 10000;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            max-width: 90%;
            text-align: center;
        }

        .hidden { display: none; }

        /* Таблица заказов */
        .orders-table-container {
            background: #111827;
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #1F2A44;
            max-height: 400px;
            overflow-y: auto;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .orders-table th {
            text-align: left;
            padding: 10px 5px;
            color: #94A3B8;
            border-bottom: 1px solid #1F2A44;
            position: sticky;
            top: 0;
            background: #111827;
        }
        .orders-table td {
            padding: 8px 5px;
            border-bottom: 1px solid #1F2A44;
        }
        .orders-table tr:last-child td { border-bottom: none; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .admin-header h1 { font-size: 1.2rem; }
            .stat-number { font-size: 1.2rem; }
            .stat-card { padding: 8px 12px; }
            .products-grid { grid-template-columns: 1fr; }
            .flavor-row { flex-direction: column; }
            .flavor-row input { width: 100%; }
            .flavor-row button { width: 100%; }
            .action-buttons { flex-direction: column; }
            .action-buttons button { width: 100%; }
            .form-row { flex-direction: column; }
            .form-row input { width: 100%; }
            .orders-table { font-size: 10px; }
        }
    </style>
</head>
<body>

<!-- ЛОГИН -->
<div id="loginBox" class="login-box">
    <h2>🔐 Админ-панель</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
</div>

<!-- АДМИН-ПАНЕЛЬ -->
<div id="adminPanel" class="admin-panel">
    <div class="admin-header">
        <h1>🛠️ Управление товарами</h1>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <!-- Статистика -->
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Заказов</div></div>
        <div class="stat-card"><div class="stat-number" id="totalRevenue" style="color:#FACC15;">0</div><div class="stat-label">Выручка</div></div>
        <div class="stat-card"><div class="stat-number" id="avgOrder" style="color:#10B981;">0</div><div class="stat-label">Средний чек</div></div>
    </div>
    
    <button id="clearStatsBtn" class="clear-stats-btn">🗑️ Очистить статистику</button>

    <!-- Таблица последних заказов -->
    <div class="orders-table-container">
        <h3 style="margin-bottom: 15px;">📋 Последние заказы</h3>
        <table class="orders-table" id="ordersTable">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Менеджер</th>
                    <th>Сумма</th>
                    <th>Товары</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>

    <!-- Категории -->
    <div class="categories-wrapper">
        <div id="categoriesBlock" class="category-buttons"></div>
    </div>

    <!-- Форма товара -->
    <div class="product-form">
        <h3 id="formTitle">➕ Новый товар</h3>
        <div class="form-row">
            <input type="text" id="productName" placeholder="Название товара">
        </div>
        <div class="image-row">
            <input type="text" id="productImage" placeholder="URL картинки">
            <button onclick="uploadFromGallery()">📱 Выбрать фото</button>
        </div>
        <div class="image-preview" id="imagePreview"></div>
        <div class="form-row">
            <textarea id="productDesc" placeholder="Описание товара" rows="2"></textarea>
        </div>
        
        <div id="flavorsList"></div>
        <button class="secondary" onclick="addFlavor()" style="width:100%; margin:8px 0;">+ Добавить вариант</button>
        
        <div class="action-buttons">
            <button class="success" onclick="saveProduct()">💾 Сохранить</button>
            <button class="danger" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Отмена</button>
        </div>
    </div>

    <!-- Список товаров -->
    <h3 style="margin: 15px 0 10px;">📦 Товары</h3>
    <div id="productsList" class="products-grid"></div>
</div>

<script>
// ========== НАСТРОЙКИ ==========
const PASSWORD = "LiniX071";
const JSONBIN_BIN_ID = "69d507df856a6821890a0bcb";
const JSONBIN_API_KEY = "$2a$10$02JoCoxrhI2J2COQIvNbM.G5Yh5iYDRA96V93DNU27viKWcqf.g5a";
const STATS_BIN_ID = "ТВОЙ_BIN_ID_СТАТИСТИКИ"; // ← ЗАМЕНИ НА СВОЙ ID

const categories = [
    { file: "Zhitkosty", name: "Жидкости", icon: "💧" },
    { file: "Snus", name: "Шайбы", icon: "👅" },
    { file: "Vapes", name: "Вейпы", icon: "💨" },
    { file: "Ispariteli", name: "Испарители", icon: "🔥" },
    { file: "Kartdritzhy", name: "Картриджи", icon: "⚡" },
    { file: "Odnorazki", name: "Одноразки", icon: "🔄" }
];

let currentCategory = null;
let currentProducts = [];
let editId = null;
let currentFlavors = [];
let cachedAllData = null;

// ========== ГЛОБАЛЬНАЯ СТАТИСТИКА ПРОДАЖ ==========
let globalStats = { orders: [], totalOrders: 0, totalRevenue: 0 };

async function loadGlobalStats() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${STATS_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (!response.ok) throw new Error('Ошибка загрузки');
        const data = await response.json();
        const record = data.record || {};
        globalStats = { 
            orders: record.orders || [], 
            totalOrders: record.totalOrders || 0, 
            totalRevenue: record.totalRevenue || 0 
        };
        updateStatsDisplay();
        renderOrdersTable();
    } catch(e) {
        console.warn('Статистика не загружена:', e);
        globalStats = { orders: [], totalOrders: 0, totalRevenue: 0 };
    }
}

async function saveGlobalStats() {
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${STATS_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({
                views: (await loadViewsForStats()) || {},
                orders: globalStats.orders,
                totalOrders: globalStats.totalOrders,
                totalRevenue: globalStats.totalRevenue,
                lastUpdated: new Date().toISOString()
            })
        });
    } catch(e) {
        console.error('Ошибка сохранения статистики:', e);
    }
}

async function loadViewsForStats() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${STATS_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const data = await response.json();
        return data.record.views || {};
    } catch { return {}; }
}

function updateStatsDisplay() {
    document.getElementById('totalOrders').textContent = globalStats.totalOrders || 0;
    document.getElementById('totalRevenue').textContent = (globalStats.totalRevenue || 0).toLocaleString();
    const avgOrder = globalStats.totalOrders > 0 ? Math.round(globalStats.totalRevenue / globalStats.totalOrders) : 0;
    document.getElementById('avgOrder').textContent = avgOrder.toLocaleString();
}

function renderOrdersTable() {
    const tbody = document.getElementById('ordersTableBody');
    if (!globalStats.orders.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#94A3B8;">Нет заказов</td></tr>';
        return;
    }
    
    const sortedOrders = [...globalStats.orders].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 20);
    
    tbody.innerHTML = sortedOrders.map(order => {
        const date = new Date(order.date).toLocaleString('ru-RU', { 
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
        });
        const itemsText = order.items.map(i => `${i.productName} (${i.variantName}) ×${i.quantity}`).join(', ');
        
        return `<tr>
            <td>${date}</td>
            <td>@${order.manager || 'неизвестно'}</td>
            <td style="color:#FACC15;">${order.total} ₽</td>
            <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;" title="${itemsText.replace(/"/g, '&quot;')}">${itemsText.substring(0, 50)}${itemsText.length > 50 ? '...' : ''}</td>
        </tr>`;
    }).join('');
}

async function addOrderToGlobalStats(cartItems, totalPrice, managerTg) {
    globalStats.orders.push({
        id: Date.now(),
        date: new Date().toISOString(),
        items: cartItems,
        total: totalPrice,
        manager: managerTg
    });
    globalStats.totalOrders = globalStats.orders.length;
    globalStats.totalRevenue = globalStats.orders.reduce((sum, o) => sum + o.total, 0);
    
    await saveGlobalStats();
    updateStatsDisplay();
    renderOrdersTable();
}

async function clearStatistics() {
    if (confirm("🗑️ Очистить всю статистику? Это действие нельзя отменить!")) {
        globalStats = { orders: [], totalOrders: 0, totalRevenue: 0 };
        await saveGlobalStats();
        updateStatsDisplay();
        renderOrdersTable();
        showToast("📊 Статистика очищена", false);
    }
}

// ========== JSONBIN (товары) ==========
async function loadAllDataFast() {
    try {
        showToast("🔄 Загрузка...", false);
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        cachedAllData = data.record || {};
        showToast("✅ Загружено", false);
        return cachedAllData;
    } catch(e) {
        showToast("❌ Ошибка загрузки", true);
        return cachedAllData || {};
    }
}

async function loadProducts() {
    if (!currentCategory) return;
    if (!cachedAllData) await loadAllDataFast();
    currentProducts = cachedAllData[currentCategory] || [];
    renderProducts();
}

async function saveToJsonBin() {
    if (!cachedAllData) await loadAllDataFast();
    cachedAllData[currentCategory] = currentProducts;
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify(cachedAllData)
        });
        showToast("✅ Сохранено!", false);
    } catch(e) {
        showToast("❌ Ошибка сохранения", true);
        throw e;
    }
}

// ========== ФУНКЦИИ АДМИНКИ ==========
function login() {
    const pwd = document.getElementById('password').value;
    if (pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCategories();
        loadGlobalStats();
        loadAllDataFast();
        showToast("Добро пожаловать!", false);
    } else {
        alert("Неверный пароль!");
    }
}

function logout() {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('password').value = '';
}

function showToast(msg, isError) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? '#EF4444' : '#10B981';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function uploadFromGallery() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('productImage').value = event.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${event.target.result}" style="max-width:80px; border-radius:12px;">`;
                showToast("✅ Фото добавлено!", false);
            };
            reader.readAsDataURL(file);
        }
    };
    fileInput.click();
}

function loadCategories() {
    const container = document.getElementById('categoriesBlock');
    container.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('span');
        btn.className = 'category-btn';
        btn.textContent = cat.icon + ' ' + cat.name;
        btn.onclick = async () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat.file;
            await loadProducts();
            cancelEdit();
        };
        container.appendChild(btn);
    });
}

function renderProducts() {
    const container = document.getElementById('productsList');
    if (!currentProducts.length) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#94A3B8;">📭 Нет товаров. Добавьте первый!</div>';
        return;
    }
    container.innerHTML = '';
    currentProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <div class="product-info">
                <div class="product-name">${escapeHtml(product.name)}</div>
                <div class="product-meta">ID: ${product.id} | ${product.flavors ? product.flavors.length + ' вариантов' : product.price + ' ₽'}</div>
                ${product.desc ? `<div class="product-meta">${escapeHtml(product.desc.substring(0, 40))}...</div>` : ''}
            </div>
            <div class="product-actions">
                <button onclick="editProduct(${product.id})">✏️</button>
                <button class="danger" onclick="deleteProduct(${product.id})">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function editProduct(id) {
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;
    editId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('productName').value = product.name;
    document.getElementById('productImage').value = product.image || '';
    document.getElementById('productDesc').value = product.desc || '';
    if (product.image) document.getElementById('imagePreview').innerHTML = `<img src="${product.image}" style="max-width:80px; border-radius:12px;">`;
    else document.getElementById('imagePreview').innerHTML = '';
    
    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price || 0, stock: product.stock || 0 }];
    }
    renderFlavors();
    document.getElementById('cancelBtn').style.display = 'block';
}

function addFlavor() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavors();
}

function renderFlavors() {
    const container = document.getElementById('flavorsList');
    if (!currentFlavors.length) {
        container.innerHTML = '<div style="padding:12px; text-align:center; color:#94A3B8;">Нет вариантов. Нажмите "+"</div>';
        return;
    }
    container.innerHTML = '';
    currentFlavors.forEach((flavor, idx) => {
        const div = document.createElement('div');
        div.className = 'flavor-row';
        div.innerHTML = `
            <input type="text" placeholder="Название" value="${escapeHtml(flavor.name)}" data-idx="${idx}" data-field="name">
            <input type="number" placeholder="Цена" value="${flavor.price}" data-idx="${idx}" data-field="price">
            <input type="number" placeholder="Остаток" value="${flavor.stock}" data-idx="${idx}" data-field="stock">
            <button class="danger" onclick="removeFlavor(${idx})">❌ Удалить</button>
        `;
        container.appendChild(div);
    });
    document.querySelectorAll('#flavorsList input').forEach(inp => {
        inp.onchange = function() {
            const idx = parseInt(this.dataset.idx);
            const field = this.dataset.field;
            const val = this.type === 'number' ? parseInt(this.value) : this.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = val;
        };
    });
}

function removeFlavor(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavors();
}

async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const image = document.getElementById('productImage').value.trim();
    const desc = document.getElementById('productDesc').value;
    if (!name) { showToast("Введите название!", true); return; }
    if (!image) { showToast("Введите URL картинки!", true); return; }
    if (!currentFlavors.length) { showToast("Добавьте вариант!", true); return; }
    if (!currentCategory) { showToast("Выберите категорию!", true); return; }

    const categoryName = categories.find(c => c.file === currentCategory)?.name || currentCategory;

    if (editId) {
        const product = currentProducts.find(p => p.id === editId);
        product.name = name;
        product.image = image;
        product.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete product.flavors;
            product.price = currentFlavors[0].price;
            product.stock = currentFlavors[0].stock;
        } else {
            product.flavors = currentFlavors.filter(f => f.name.trim());
            delete product.price;
            delete product.stock;
        }
    } else {
        const newId = Math.max(...currentProducts.map(p => p.id), 0) + 1;
        const newProduct = {
            id: newId,
            name: name,
            category: categoryName,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        currentProducts.push(newProduct);
    }
    await saveToJsonBin();
    cancelEdit();
    await loadProducts();
    showToast("✅ Товар сохранён!", false);
}

async function deleteProduct(id) {
    if (!confirm("🗑️ Точно удалить товар?")) return;
    currentProducts = currentProducts.filter(p => p.id !== id);
    await saveToJsonBin();
    await loadProducts();
    if (editId === id) cancelEdit();
    showToast("✅ Товар удалён!", false);
}

function cancelEdit() {
    editId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Новый товар';
    document.getElementById('productName').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('flavorsList').innerHTML = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
}

document.getElementById('productImage').addEventListener('input', function() {
    if (this.value) document.getElementById('imagePreview').innerHTML = `<img src="${this.value}" style="max-width:80px; border-radius:12px;">`;
    else document.getElementById('imagePreview').innerHTML = '';
});

document.getElementById('clearStatsBtn')?.addEventListener('click', clearStatistics);

window.addFlavor = addFlavor;
window.removeFlavor = removeFlavor;
window.saveProduct = saveProduct;
window.deleteProduct = deleteProduct;
window.editProduct = editProduct;
window.cancelEdit = cancelEdit;
window.login = login;
window.logout = logout;
window.uploadFromGallery = uploadFromGallery;
</script>
</body>
