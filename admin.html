<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        body {
            background: #0A0F1E;
            color: white;
            font-family: system-ui;
            padding: 20px;
        }
        .login-box {
            max-width: 300px;
            margin: 100px auto;
            background: #111827;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1E293B;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }
        .login-box button {
            background: #3B82F6;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        .panel {
            display: none;
        }
        button {
            background: #3B82F6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        .danger { background: #EF4444; }
        .success { background: #10B981; }
        .category-btn {
            display: inline-block;
            background: #1E293B;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
        }
        .category-btn.active {
            background: #3B82F6;
        }
        .product-card {
            background: #111827;
            padding: 15px;
            margin: 10px 0;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1E293B;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
        }
        .flavor-row {
            background: #1E293B;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<!-- Форма входа -->
<div id="loginBox" class="login-box">
    <h2>🔐 Вход</h2>
    <input type="password" id="passInput" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p style="margin-top:10px; font-size:12px;">Пароль: admin123</p>
</div>

<!-- Админ панель -->
<div id="adminPanel" class="panel">
    <h1>🛠️ Админ-панель</h1>
    
    <div id="cats"></div>
    
    <div style="background:#111827; padding:20px; border-radius:20px; margin:20px 0;">
        <h3 id="formTitle">➕ Новый товар</h3>
        <input type="text" id="name" placeholder="Название">
        <input type="text" id="image" placeholder="URL картинки">
        <textarea id="desc" placeholder="Описание" rows="2"></textarea>
        
        <div id="flavorsBlock"></div>
        <button onclick="addFlavorField()">+ Добавить вариант</button>
        
        <div style="margin-top:15px;">
            <button class="success" onclick="saveProduct()">💾 Сохранить</button>
            <button class="danger" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Отмена</button>
        </div>
    </div>
    
    <h3>📦 Товары</h3>
    <div id="productsList"></div>
</div>

<script>
// ПАРОЛЬ
const PASSWORD = "admin123";

// ДАННЫЕ (временное хранилище, пока без GitHub)
let products = [];
let currentCat = null;
let editId = null;

// КАТЕГОРИИ
const categories = [
    { id: "Zhitkosty", name: "Жидкости" },
    { id: "Snus", name: "Снюс" },
    { id: "Vapes", name: "Вейпы" },
    { id: "Ispariteli", name: "Испарители" },
    { id: "Kartdritzhy", name: "Картриджи" },
    { id: "Odnorazki", name: "Одноразки" }
];

// ВХОД
window.login = function() {
    const pwd = document.getElementById('passInput').value;
    if (pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCategories();
        loadProductsFromStorage();
    } else {
        alert("Неверный пароль!");
    }
};

// ЗАГРУЗКА КАТЕГОРИЙ
function loadCategories() {
    const container = document.getElementById('cats');
    container.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('span');
        btn.className = 'category-btn';
        btn.textContent = cat.name;
        btn.onclick = () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = cat.id;
            loadProductsForCategory();
            cancelEdit();
        };
        container.appendChild(btn);
    });
}

// ЗАГРУЗКА ТОВАРОВ
function loadProductsFromStorage() {
    const saved = localStorage.getItem('iceshop_products');
    if (saved) {
        products = JSON.parse(saved);
    } else {
        products = [];
    }
}

function saveProductsToStorage() {
    localStorage.setItem('iceshop_products', JSON.stringify(products));
}

function loadProductsForCategory() {
    const container = document.getElementById('productsList');
    const catProducts = products.filter(p => p.category === currentCat);
    
    if (catProducts.length === 0) {
        container.innerHTML = '<div>Нет товаров. Добавьте первый!</div>';
        return;
    }
    
    container.innerHTML = '';
    catProducts.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <div>
                <strong>${escapeHtml(p.name)}</strong><br>
                <small>ID: ${p.id} | ${p.flavors ? p.flavors.length + ' вариантов' : p.price + ' ₽'}</small>
            </div>
            <div>
                <button onclick="editProduct(${p.id})">✏️</button>
                <button class="danger" onclick="deleteProduct(${p.id})">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// РАБОТА С ВАРИАНТАМИ
let currentFlavors = [];

function addFlavorField() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavors();
}

function renderFlavors() {
    const container = document.getElementById('flavorsBlock');
    if (currentFlavors.length === 0) {
        container.innerHTML = '<div style="padding:10px;">Нет вариантов. Нажмите "+"</div>';
        return;
    }
    container.innerHTML = '';
    currentFlavors.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'flavor-row';
        div.innerHTML = `
            <input type="text" placeholder="Название (цвет/вкус)" value="${escapeHtml(f.name)}" data-idx="${idx}" data-field="name" style="flex:2;">
            <input type="number" placeholder="Цена" value="${f.price}" data-idx="${idx}" data-field="price" style="width:100px;">
            <input type="number" placeholder="Остаток" value="${f.stock}" data-idx="${idx}" data-field="stock" style="width:100px;">
            <button class="danger" onclick="removeFlavor(${idx})">❌</button>
        `;
        container.appendChild(div);
    });
    
    document.querySelectorAll('#flavorsBlock input').forEach(inp => {
        inp.onchange = function() {
            const idx = parseInt(this.dataset.idx);
            const field = this.dataset.field;
            const val = this.type === 'number' ? parseInt(this.value) : this.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = val;
        };
    });
}

window.removeFlavor = function(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavors();
};

// СОХРАНЕНИЕ
window.saveProduct = function() {
    const name = document.getElementById('name').value.trim();
    const image = document.getElementById('image').value.trim();
    const desc = document.getElementById('desc').value;
    
    if (!name) { alert("Введите название!"); return; }
    if (!image) { alert("Введите URL картинки!"); return; }
    if (currentFlavors.length === 0) { alert("Добавьте хотя бы один вариант!"); return; }
    if (!currentCat) { alert("Выберите категорию!"); return; }
    
    const categoryName = categories.find(c => c.id === currentCat)?.name || currentCat;
    
    if (editId) {
        // Редактирование
        const product = products.find(p => p.id === editId);
        product.name = name;
        product.image = image;
        product.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete product.flavors;
            product.price = currentFlavors[0].price;
            product.stock = currentFlavors[0].stock;
        } else {
            product.flavors = currentFlavors.filter(f => f.name.trim());
            delete product.price;
            delete product.stock;
        }
    } else {
        // Новый товар
        const newId = Math.max(...products.map(p => p.id), 0) + 1;
        const newProduct = {
            id: newId,
            name: name,
            category: currentCat,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        products.push(newProduct);
    }
    
    saveProductsToStorage();
    loadProductsForCategory();
    cancelEdit();
    alert("✅ Товар сохранён!");
};

window.editProduct = function(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    
    editId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('name').value = product.name;
    document.getElementById('image').value = product.image || '';
    document.getElementById('desc').value = product.desc || '';
    
    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price, stock: product.stock }];
    }
    renderFlavors();
    document.getElementById('cancelBtn').style.display = 'inline-block';
};

window.deleteProduct = function(id) {
    if (!confirm("Удалить товар?")) return;
    products = products.filter(p => p.id !== id);
    saveProductsToStorage();
    loadProductsForCategory();
    cancelEdit();
    alert("🗑️ Товар удалён");
};

function cancelEdit() {
    editId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Новый товар';
    document.getElementById('name').value = '';
    document.getElementById('image').value = '';
    document.getElementById('desc').value = '';
    document.getElementById('flavorsBlock').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
}

// Кнопки
window.addFlavorField = addFlavorField;
window.cancelEdit = cancelEdit;
</script>
</body>
</html>
