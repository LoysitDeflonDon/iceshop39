<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель ICESHOP39</title>
    <style>
        body { background: #0A0F1E; color: white; font-family: system-ui; padding: 20px; }
        .box { max-width: 400px; margin: 100px auto; background: #111827; padding: 30px; border-radius: 20px; text-align: center; }
        .box input { width: 100%; padding: 12px; margin: 15px 0; background: #1E293B; border: 1px solid #333; border-radius: 10px; color: white; font-size: 16px; }
        .box button { background: #3B82F6; color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        .panel { display: none; max-width: 1200px; margin: 0 auto; }
        .category-btn { display: inline-block; background: #1E293B; padding: 10px 20px; margin: 5px; border-radius: 30px; cursor: pointer; }
        .category-btn.active { background: #3B82F6; }
        .product-form { background: #111827; padding: 20px; border-radius: 20px; margin: 20px 0; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #1E293B; border: 1px solid #333; border-radius: 8px; color: white; }
        .image-upload-area { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
        .image-upload-area input { flex: 1; margin: 0; }
        .image-upload-area button { background: #334155; width: auto; padding: 10px 15px; margin: 0; }
        .image-preview { margin-top: 10px; }
        .image-preview img { max-width: 100px; max-height: 100px; border-radius: 10px; }
        .flavor-item { background: #1E293B; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .flavor-item input { flex: 1; margin: 0; }
        button.danger { background: #EF4444; width: auto; }
        button.success { background: #10B981; width: auto; }
        .product-card { background: #111827; padding: 15px; margin: 10px 0; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10B981; padding: 12px 24px; border-radius: 10px; z-index: 1000; }
        .hidden { display: none; }
        
        /* Стили для статистики */
        .stats-section {
            background: #111827;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .stats-section h3, .stats-section h4 {
            margin-bottom: 15px;
            color: #3B82F6;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .stat-card {
            background: #1E293B;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #3B82F6;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #94A3B8;
        }
        .top-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #1F2A44;
        }
        .top-product-name {
            font-weight: 600;
        }
        .top-product-count {
            color: #FACC15;
            font-weight: bold;
        }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #1F2A44;
            font-size: 0.9rem;
        }
        .daily-date {
            color: #94A3B8;
        }
        .daily-total {
            color: #FACC15;
            font-weight: bold;
        }
        
        @media (max-width: 700px) { .flavor-item { flex-direction: column; } }
    </style>
</head>
<body>

<div id="loginBox" class="box">
    <h2>🔐 Админ-панель</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p style="margin-top:15px; font-size:12px;">Пароль: admin123</p>
</div>

<div id="adminPanel" class="panel">
    <h1>🛠️ Управление товарами ICESHOP39</h1>
    
    <!-- БЛОК СТАТИСТИКИ -->
    <div class="stats-section">
        <h3>📊 Статистика продаж</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">0</div>
                <div class="stat-label">Всего заказов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRevenue" style="color:#FACC15;">0</div>
                <div class="stat-label">Общая выручка (₽)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgOrder" style="color:#10B981;">0</div>
                <div class="stat-label">Средний чек (₽)</div>
            </div>
        </div>
        
        <h4>🔥 Топ товаров</h4>
        <div id="topProducts"></div>
        
        <h4>📅 Продажи по дням</h4>
        <div id="dailyStats"></div>
        
        <button id="clearStatsBtn" class="danger" style="margin-top: 10px;">🗑️ Очистить статистику</button>
    </div>
    
    <div id="categoriesBlock"></div>
    
    <div class="product-form">
        <h3 id="formTitle">➕ Добавить товар</h3>
        <input type="text" id="productName" placeholder="Название товара">
        
        <div class="image-upload-area">
            <input type="text" id="productImage" placeholder="URL картинки">
            <button onclick="uploadFromGallery()">📱 Выбрать фото</button>
        </div>
        <div class="image-preview" id="imagePreview"></div>
        
        <textarea id="productDesc" placeholder="Описание товара" rows="2"></textarea>
        
        <div id="flavorsBlock"></div>
        <button onclick="addFlavor()" style="background:#334155; width:auto;">+ Добавить вариант (цвет/вкус)</button>
        
        <div style="margin-top:15px;">
            <button class="success" onclick="saveProduct()">💾 Сохранить (мгновенно)</button>
            <button class="danger" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Отмена</button>
        </div>
    </div>
    
    <h3>📦 Товары в категории</h3>
    <div id="productsList"></div>
</div>

<script>
// ========== НАСТРОЙКИ JSONBIN.IO ==========
const JSONBIN_BIN_ID = "69d2bd29856a682189011200";
const JSONBIN_API_KEY = "$2a$10$8svHLhjJ9/K.QIVEyStHqO5J0YM6BqjnxmK.UUn2b.Axxicf3KCcK";

// ========== ПАРОЛЬ ==========
const PASSWORD = "admin123";

// ========== КАТЕГОРИИ ==========
const categories = [
    { file: "Zhitkosty", name: "Жидкости", icon: "💧" },
    { file: "Snus", name: "Снюс", icon: "👅" },
    { file: "Vapes", name: "Вейпы", icon: "💨" },
    { file: "Ispariteli", name: "Испарители", icon: "🔥" },
    { file: "Kartdritzhy", name: "Картриджи", icon: "⚡" },
    { file: "Odnorazki", name: "Одноразки", icon: "🔄" }
];

let currentCategory = null;
let currentProducts = [];
let editId = null;
let currentFlavors = [];

// Кеш для данных (чтобы не грузить каждый раз)
let cachedAllData = null;
let lastLoadTime = 0;

// ========== СТАТИСТИКА ==========
const STATS_KEY = "shop_statistics";

function loadStatistics() {
    const stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{"orders":[], "totalOrders":0, "totalRevenue":0}');
    return stats;
}

function updateStatsDisplay() {
    const stats = loadStatistics();
    
    document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
    document.getElementById('totalRevenue').textContent = (stats.totalRevenue || 0).toLocaleString();
    const avgOrder = stats.totalOrders > 0 ? Math.round(stats.totalRevenue / stats.totalOrders) : 0;
    document.getElementById('avgOrder').textContent = avgOrder.toLocaleString();
    
    const productCounts = {};
    stats.orders.forEach(order => {
        order.items.forEach(item => {
            const key = `${item.productName} - ${item.variantName}`;
            productCounts[key] = (productCounts[key] || 0) + item.quantity;
        });
    });
    
    const topProducts = Object.entries(productCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const topProductsDiv = document.getElementById('topProducts');
    if (topProducts.length === 0) {
        topProductsDiv.innerHTML = '<div style="color:#94A3B8;">Нет данных</div>';
    } else {
        topProductsDiv.innerHTML = topProducts.map(([name, count]) => `
            <div class="top-product-item">
                <span class="top-product-name">${escapeHtmlStats(name)}</span>
                <span class="top-product-count">${count} шт</span>
            </div>
        `).join('');
    }
    
    const dailyMap = {};
    stats.orders.forEach(order => {
        const date = order.date.split('T')[0];
        dailyMap[date] = (dailyMap[date] || 0) + order.total;
    });
    
    const last7Days = [];
    for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        last7Days.push({ date: dateStr, total: dailyMap[dateStr] || 0 });
    }
    
    const dailyDiv = document.getElementById('dailyStats');
    if (last7Days.every(d => d.total === 0)) {
        dailyDiv.innerHTML = '<div style="color:#94A3B8;">Нет продаж за последние 7 дней</div>';
    } else {
        dailyDiv.innerHTML = last7Days.map(day => `
            <div class="daily-item">
                <span class="daily-date">${day.date}</span>
                <span class="daily-total">${day.total.toLocaleString()} ₽</span>
            </div>
        `).join('');
    }
}

function clearStatistics() {
    if (confirm("🗑️ Очистить всю статистику?")) {
        localStorage.setItem(STATS_KEY, '{"orders":[], "totalOrders":0, "totalRevenue":0}');
        updateStatsDisplay();
        showToast("📊 Статистика очищена", false);
    }
}

function escapeHtmlStats(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

// ========== БЫСТРАЯ ЗАГРУЗКА/СОХРАНЕНИЕ ==========
async function loadAllDataFast() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const data = await response.json();
        cachedAllData = data.record || {};
        lastLoadTime = Date.now();
        return cachedAllData;
    } catch(e) {
        console.error('Ошибка загрузки:', e);
        return cachedAllData || {};
    }
}

async function loadProducts() {
    if (!currentCategory) return;
    document.getElementById('productsList').innerHTML = '<div>🔄 Загрузка...</div>';
    
    // Используем кеш если он свежий (менее 5 секунд)
    if (!cachedAllData || Date.now() - lastLoadTime > 5000) {
        await loadAllDataFast();
    }
    
    currentProducts = cachedAllData[currentCategory] || [];
    renderProducts();
}

async function saveToJsonBin() {
    if (!cachedAllData) {
        await loadAllDataFast();
    }
    cachedAllData[currentCategory] = currentProducts;
    
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(cachedAllData)
    });
}

// ========== ФУНКЦИИ АДМИНКИ ==========
function login() {
    const pwd = document.getElementById('password').value;
    if (pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCategories();
        updateStatsDisplay();
        loadAllDataFast(); // Предзагружаем данные
        showToast("Добро пожаловать!", false);
    } else {
        alert("Неверный пароль!");
    }
}

function showToast(msg, isError) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? '#EF4444' : '#10B981';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function uploadFromGallery() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('productImage').value = event.target.result;
                showPreview(event.target.result);
                showToast("✅ Фото добавлено!", false);
            };
            reader.readAsDataURL(file);
        }
    };
    fileInput.click();
}

function showPreview(url) {
    const preview = document.getElementById('imagePreview');
    preview.innerHTML = `<img src="${url}" alt="preview" style="max-width:100px; max-height:100px; border-radius:10px;">`;
}

function loadCategories() {
    const container = document.getElementById('categoriesBlock');
    container.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('span');
        btn.className = 'category-btn';
        btn.textContent = cat.icon + ' ' + cat.name;
        btn.onclick = async () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat.file;
            await loadProducts();
            cancelEdit();
        };
        container.appendChild(btn);
    });
}

function renderProducts() {
    const container = document.getElementById('productsList');
    if (!currentProducts.length) {
        container.innerHTML = '<div>📭 Нет товаров. Добавьте первый!</div>';
        return;
    }
    container.innerHTML = '';
    currentProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <div>
                <strong>${escapeHtml(product.name)}</strong><br>
                <small>ID: ${product.id} | ${product.flavors ? product.flavors.length + ' вариантов' : product.price + ' ₽'}</small>
                ${product.desc ? `<br><small style="color:#94A3B8;">${escapeHtml(product.desc.substring(0, 50))}...</small>` : ''}
            </div>
            <div>
                <button onclick="editProduct(${product.id})">✏️</button>
                <button class="danger" onclick="deleteProduct(${product.id})">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function editProduct(id) {
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;
    
    editId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('productName').value = product.name;
    document.getElementById('productImage').value = product.image || '';
    document.getElementById('productDesc').value = product.desc || '';
    if (product.image) showPreview(product.image);
    else document.getElementById('imagePreview').innerHTML = '';
    
    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price || 0, stock: product.stock || 0 }];
    }
    renderFlavors();
    document.getElementById('cancelBtn').style.display = 'inline-block';
}

function addFlavor() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavors();
}

function renderFlavors() {
    const container = document.getElementById('flavorsBlock');
    if (!currentFlavors.length) {
        container.innerHTML = '<div style="padding:10px;">Нет вариантов. Нажмите "+"</div>';
        return;
    }
    container.innerHTML = '';
    currentFlavors.forEach((flavor, idx) => {
        const div = document.createElement('div');
        div.className = 'flavor-item';
        div.innerHTML = `
            <input type="text" placeholder="Название" value="${escapeHtml(flavor.name)}" data-idx="${idx}" data-field="name" style="flex:2;">
            <input type="number" placeholder="Цена" value="${flavor.price}" data-idx="${idx}" data-field="price" style="width:120px;">
            <input type="number" placeholder="Остаток" value="${flavor.stock}" data-idx="${idx}" data-field="stock" style="width:120px;">
            <button class="danger" onclick="removeFlavor(${idx})">❌</button>
        `;
        container.appendChild(div);
    });
    document.querySelectorAll('#flavorsBlock input').forEach(inp => {
        inp.onchange = function() {
            const idx = parseInt(this.dataset.idx);
            const field = this.dataset.field;
            const val = this.type === 'number' ? parseInt(this.value) : this.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = val;
        };
    });
}

function removeFlavor(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavors();
}

async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const image = document.getElementById('productImage').value.trim();
    const desc = document.getElementById('productDesc').value;
    
    if (!name) { showToast("Введите название!", true); return; }
    if (!image) { showToast("Введите URL картинки!", true); return; }
    if (!currentFlavors.length) { showToast("Добавьте вариант!", true); return; }
    if (!currentCategory) { showToast("Выберите категорию!", true); return; }
    
    const categoryName = categories.find(c => c.file === currentCategory)?.name || currentCategory;
    
    if (editId) {
        const product = currentProducts.find(p => p.id === editId);
        product.name = name;
        product.image = image;
        product.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete product.flavors;
            product.price = currentFlavors[0].price;
            product.stock = currentFlavors[0].stock;
        } else {
            product.flavors = currentFlavors.filter(f => f.name.trim());
            delete product.price;
            delete product.stock;
        }
    } else {
        const newId = Math.max(...currentProducts.map(p => p.id), 0) + 1;
        const newProduct = {
            id: newId,
            name: name,
            category: categoryName,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        currentProducts.push(newProduct);
    }
    
    await saveToJsonBin();
    cancelEdit();
    await loadProducts();
    showToast("✅ Товар сохранён!", false);
}

async function deleteProduct(id) {
    if (!confirm("🗑️ Точно удалить товар?")) return;
    currentProducts = currentProducts.filter(p => p.id !== id);
    await saveToJsonBin();
    await loadProducts();
    if (editId === id) cancelEdit();
    showToast("✅ Товар удалён!", false);
}

function cancelEdit() {
    editId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Добавить товар';
    document.getElementById('productName').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('flavorsBlock').innerHTML = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
}

document.getElementById('productImage').addEventListener('input', function() {
    if (this.value) showPreview(this.value);
    else document.getElementById('imagePreview').innerHTML = '';
});

document.getElementById('clearStatsBtn')?.addEventListener('click', clearStatistics);

window.addFlavor = addFlavor;
window.removeFlavor = removeFlavor;
window.saveProduct = saveProduct;
window.deleteProduct = deleteProduct;
window.editProduct = editProduct;
window.cancelEdit = cancelEdit;
window.login = login;
window.uploadFromGallery = uploadFromGallery;
</script>
</body>
</html>
