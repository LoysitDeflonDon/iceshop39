<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Админ-панель ICESHOP39</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #0A0F1E; 
            color: white; 
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; 
            padding: 16px;
            padding-bottom: 30px;
        }

        .box { 
            max-width: 400px; 
            margin: 50px auto; 
            background: #111827; 
            padding: 24px; 
            border-radius: 24px; 
            text-align: center; 
        }

        .box input { 
            width: 100%; 
            padding: 14px; 
            margin: 15px 0; 
            background: #1E293B; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            color: white; 
            font-size: 16px; 
        }

        .box button { 
            background: #3B82F6; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            font-size: 16px;
        }

        .panel { 
            display: none; 
            max-width: 800px; 
            margin: 0 auto; 
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #3B82F6;
            text-align: center;
        }

        .categories-wrapper {
            overflow-x: auto;
            margin: 20px 0;
            -webkit-overflow-scrolling: touch;
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            padding-bottom: 8px;
        }

        .category-btn { 
            display: inline-block; 
            background: #1E293B; 
            padding: 10px 18px; 
            border-radius: 40px; 
            cursor: pointer; 
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .category-btn.active { 
            background: #3B82F6; 
        }

        .category-btn:active {
            transform: scale(0.96);
        }

        .product-form { 
            background: #111827; 
            padding: 20px; 
            border-radius: 24px; 
            margin: 20px 0; 
        }

        .product-form h3 {
            margin-bottom: 16px;
            color: #3B82F6;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #1E293B; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            color: white; 
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .image-upload-area { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
            margin: 12px 0; 
        }

        .image-upload-area input { 
            flex: 1; 
            margin: 0; 
        }

        .image-upload-area button { 
            background: #334155; 
            width: auto; 
            padding: 12px 16px; 
            margin: 0; 
            font-size: 14px;
            white-space: nowrap;
        }

        .image-preview { 
            margin-top: 10px; 
        }

        .image-preview img { 
            max-width: 100px; 
            max-height: 100px; 
            border-radius: 12px; 
        }

        .flavor-item { 
            background: #1E293B; 
            padding: 16px; 
            margin: 12px 0; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
        }

        .flavor-item input { 
            margin: 0; 
            padding: 12px;
        }

        .flavor-item button {
            width: 100%;
            margin-top: 4px;
        }

        button { 
            background: #3B82F6; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 12px; 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        button.danger { background: #EF4444; }
        button.success { background: #10B981; }

        .product-card { 
            background: #111827; 
            padding: 16px; 
            margin: 12px 0; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
        }

        .product-card > div:first-child {
            flex: 1;
            min-width: 150px;
        }

        .product-card strong {
            font-size: 16px;
        }

        .product-card small {
            font-size: 12px;
            color: #94A3B8;
        }

        .stats-section {
            background: #111827;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
        }

        .stats-section h3, .stats-section h4 {
            margin-bottom: 16px;
            color: #3B82F6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 15px 0;
        }

        .stat-card {
            background: #1E293B;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3B82F6;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #94A3B8;
        }

        .top-product-item, .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1F2A44;
        }

        .top-product-name {
            font-weight: 500;
            font-size: 14px;
        }

        .top-product-count, .daily-total {
            color: #FACC15;
            font-weight: bold;
        }

        .daily-date {
            color: #94A3B8;
            font-size: 13px;
        }

        .toast { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #10B981; 
            padding: 12px 20px; 
            border-radius: 60px; 
            z-index: 10000; 
            font-size: 14px; 
            white-space: nowrap; 
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            max-width: 90%;
            white-space: normal;
            text-align: center;
        }

        .hidden { display: none; }

        @media (max-width: 550px) {
            body { padding: 12px; }
            h1 { font-size: 1.5rem; }
            .stats-grid { gap: 8px; }
            .stat-number { font-size: 1.2rem; }
            .product-card { flex-direction: column; align-items: flex-start; }
            .product-card > div:last-child { width: 100%; display: flex; gap: 10px; }
            .product-card button { flex: 1; }
            button { padding: 12px 16px; }
        }

        @media (min-width: 768px) {
            .flavor-item { flex-direction: row; align-items: center; }
            .flavor-item input { flex: 1; }
            .flavor-item button { width: auto; }
        }
    </style>
</head>
<body>

<div id="loginBox" class="box">
    <h2>🔐 Админ-панель</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p style="margin-top:15px; font-size:12px; color:#94A3B8;">Введи пароль для входа</p>
</div>

<div id="adminPanel" class="panel">
    <h1>🛠️ Управление товарами</h1>

    <div class="stats-section">
        <h3>📊 Статистика продаж</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">0</div>
                <div class="stat-label">Всего заказов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRevenue" style="color:#FACC15;">0</div>
                <div class="stat-label">Выручка (₽)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgOrder" style="color:#10B981;">0</div>
                <div class="stat-label">Средний чек</div>
            </div>
        </div>
        <h4>🔥 Топ товаров</h4>
        <div id="topProducts"></div>
        <h4>📅 Продажи по дням</h4>
        <div id="dailyStats"></div>
        <button id="clearStatsBtn" class="danger" style="margin-top: 10px; width: 100%;">🗑️ Очистить статистику</button>
    </div>

    <div class="categories-wrapper">
        <div id="categoriesBlock" class="category-buttons"></div>
    </div>

    <div class="product-form">
        <h3 id="formTitle">➕ Добавить товар</h3>
        <input type="text" id="productName" placeholder="Название товара">
        <div class="image-upload-area">
            <input type="text" id="productImage" placeholder="URL картинки">
            <button onclick="uploadFromGallery()">📱 Выбрать фото</button>
        </div>
        <div class="image-preview" id="imagePreview"></div>
        <textarea id="productDesc" placeholder="Описание товара" rows="2"></textarea>
        <div id="flavorsBlock"></div>
        <button onclick="addFlavor()" style="background:#334155; width: 100%; margin-top: 8px;">+ Добавить вариант (цвет/вкус)</button>
        <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="success" onclick="saveProduct()" style="flex: 1;">💾 Сохранить</button>
            <button class="danger" onclick="cancelEdit()" id="cancelBtn" style="display:none; flex: 1;">Отмена</button>
        </div>
    </div>

    <h3>📦 Товары в категории</h3>
    <div id="productsList"></div>
</div>

<script>
// ========== НАСТРОЙКИ JSONBIN.IO (ТВОИ НОВЫЕ КЛЮЧИ) ==========
const JSONBIN_BIN_ID = "69d38f61aaba882197cc0181";
const JSONBIN_API_KEY = "$2a$10$JDcgEEE3qx9B6QlESZPsAeK1P72GoKPWRU2jiNzLiUbeLXt/nWMqG";

// ========== ПАРОЛЬ ==========
const PASSWORD = "LiniX071";

// ========== КАТЕГОРИИ ==========
const categories = [
    { file: "Zhitkosty", name: "Жидкости", icon: "💧" },
    { file: "Snus", name: "Снюс", icon: "👅" },
    { file: "Vapes", name: "Вейпы", icon: "💨" },
    { file: "Ispariteli", name: "Испарители", icon: "🔥" },
    { file: "Kartdritzhy", name: "Картриджи", icon: "⚡" },
    { file: "Odnorazki", name: "Одноразки", icon: "🔄" }
];

let currentCategory = null;
let currentProducts = [];
let editId = null;
let currentFlavors = [];
let cachedAllData = null;
let lastLoadTime = 0;

// ========== СТАТИСТИКА ==========
const STATS_KEY = "shop_statistics";

function loadStatistics() {
    const stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{"orders":[], "totalOrders":0, "totalRevenue":0}');
    return stats;
}

function updateStatsDisplay() {
    const stats = loadStatistics();
    document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
    document.getElementById('totalRevenue').textContent = (stats.totalRevenue || 0).toLocaleString();
    const avgOrder = stats.totalOrders > 0 ? Math.round(stats.totalRevenue / stats.totalOrders) : 0;
    document.getElementById('avgOrder').textContent = avgOrder.toLocaleString();

    const productCounts = {};
    stats.orders.forEach(order => {
        order.items.forEach(item => {
            const key = `${item.productName} - ${item.variantName}`;
            productCounts[key] = (productCounts[key] || 0) + item.quantity;
        });
    });

    const topProducts = Object.entries(productCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const topProductsDiv = document.getElementById('topProducts');
    if (topProducts.length === 0) {
        topProductsDiv.innerHTML = '<div style="color:#94A3B8;">Нет данных</div>';
    } else {
        topProductsDiv.innerHTML = topProducts.map(([name, count]) => `
            <div class="top-product-item">
                <span class="top-product-name">${escapeHtmlStats(name)}</span>
                <span class="top-product-count">${count} шт</span>
            </div>
        `).join('');
    }

    const dailyMap = {};
    stats.orders.forEach(order => {
        const date = order.date.split('T')[0];
        dailyMap[date] = (dailyMap[date] || 0) + order.total;
    });

    const last7Days = [];
    for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        last7Days.push({ date: dateStr, total: dailyMap[dateStr] || 0 });
    }

    const dailyDiv = document.getElementById('dailyStats');
    if (last7Days.every(d => d.total === 0)) {
        dailyDiv.innerHTML = '<div style="color:#94A3B8;">Нет продаж за 7 дней</div>';
    } else {
        dailyDiv.innerHTML = last7Days.map(day => `
            <div class="daily-item">
                <span class="daily-date">${day.date}</span>
                <span class="daily-total">${day.total.toLocaleString()} ₽</span>
            </div>
        `).join('');
    }
}

function clearStatistics() {
    if (confirm("🗑️ Очистить всю статистику?")) {
        localStorage.setItem(STATS_KEY, '{"orders":[], "totalOrders":0, "totalRevenue":0}');
        updateStatsDisplay();
        showToast("📊 Статистика очищена", false);
    }
}

function escapeHtmlStats(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

// ========== ЗАГРУЗКА/СОХРАНЕНИЕ JSONBIN ==========
async function loadAllDataFast() {
    try {
        showToast("🔄 Загрузка данных...", false);
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        cachedAllData = data.record || {};
        lastLoadTime = Date.now();
        showToast("✅ Данные загружены", false);
        return cachedAllData;
    } catch(e) {
        console.error('Ошибка загрузки:', e);
        showToast("❌ Ошибка загрузки данных! Проверь Bin ID и API Key", true);
        return cachedAllData || {};
    }
}

async function loadProducts() {
    if (!currentCategory) return;
    document.getElementById('productsList').innerHTML = '<div style="text-align:center; padding:20px;">🔄 Загрузка...</div>';

    if (!cachedAllData || Date.now() - lastLoadTime > 5000) {
        await loadAllDataFast();
    }

    currentProducts = cachedAllData[currentCategory] || [];
    renderProducts();
}

async function saveToJsonBin() {
    if (!cachedAllData) {
        await loadAllDataFast();
    }
    cachedAllData[currentCategory] = currentProducts;

    try {
        showToast("💾 Сохранение...", false);
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify(cachedAllData)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        showToast("✅ Сохранено!", false);
    } catch(e) {
        console.error('Ошибка сохранения:', e);
        showToast("❌ Ошибка сохранения! Проверь Bin ID и API Key", true);
        throw e;
    }
}

// ========== ФУНКЦИИ АДМИНКИ ==========
function login() {
    const pwd = document.getElementById('password').value;
    if (pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCategories();
        updateStatsDisplay();
        loadAllDataFast();
        showToast("Добро пожаловать!", false);
    } else {
        alert("Неверный пароль!");
    }
}

function showToast(msg, isError) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? '#EF4444' : '#10B981';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function uploadFromGallery() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('productImage').value = event.target.result;
                showPreview(event.target.result);
                showToast("✅ Фото добавлено!", false);
            };
            reader.readAsDataURL(file);
        }
    };
    fileInput.click();
}

function showPreview(url) {
    const preview = document.getElementById('imagePreview');
    preview.innerHTML = `<img src="${url}" alt="preview" style="max-width:100px; max-height:100px; border-radius:12px;">`;
}

function loadCategories() {
    const container = document.getElementById('categoriesBlock');
    container.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('span');
        btn.className = 'category-btn';
        btn.textContent = cat.icon + ' ' + cat.name;
        btn.onclick = async () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat.file;
            await loadProducts();
            cancelEdit();
        };
        container.appendChild(btn);
    });
}

function renderProducts() {
    const container = document.getElementById('productsList');
    if (!currentProducts.length) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#94A3B8;">📭 Нет товаров. Добавьте первый!</div>';
        return;
    }
    container.innerHTML = '';
    currentProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <div>
                <strong>${escapeHtml(product.name)}</strong><br>
                <small>ID: ${product.id} | ${product.flavors ? product.flavors.length + ' вариантов' : product.price + ' ₽'}</small>
                ${product.desc ? `<br><small style="color:#94A3B8;">${escapeHtml(product.desc.substring(0, 50))}...</small>` : ''}
            </div>
            <div>
                <button onclick="editProduct(${product.id})">✏️</button>
                <button class="danger" onclick="deleteProduct(${product.id})">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function editProduct(id) {
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;

    editId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('productName').value = product.name;
    document.getElementById('productImage').value = product.image || '';
    document.getElementById('productDesc').value = product.desc || '';
    if (product.image) showPreview(product.image);
    else document.getElementById('imagePreview').innerHTML = '';

    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price || 0, stock: product.stock || 0 }];
    }
    renderFlavors();
    document.getElementById('cancelBtn').style.display = 'inline-block';
}

function addFlavor() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavors();
}

function renderFlavors() {
    const container = document.getElementById('flavorsBlock');
    if (!currentFlavors.length) {
        container.innerHTML = '<div style="padding:12px; background:#1E293B; border-radius:12px; text-align:center;">Нет вариантов. Нажмите "+"</div>';
        return;
    }
    container.innerHTML = '';
    currentFlavors.forEach((flavor, idx) => {
        const div = document.createElement('div');
        div.className = 'flavor-item';
        div.innerHTML = `
            <input type="text" placeholder="Название" value="${escapeHtml(flavor.name)}" data-idx="${idx}" data-field="name">
            <input type="number" placeholder="Цена" value="${flavor.price}" data-idx="${idx}" data-field="price">
            <input type="number" placeholder="Остаток" value="${flavor.stock}" data-idx="${idx}" data-field="stock">
            <button class="danger" onclick="removeFlavor(${idx})">❌ Удалить</button>
        `;
        container.appendChild(div);
    });
    document.querySelectorAll('#flavorsBlock input').forEach(inp => {
        inp.onchange = function() {
            const idx = parseInt(this.dataset.idx);
            const field = this.dataset.field;
            const val = this.type === 'number' ? parseInt(this.value) : this.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = val;
        };
    });
}

function removeFlavor(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavors();
}

async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const image = document.getElementById('productImage').value.trim();
    const desc = document.getElementById('productDesc').value;

    if (!name) { showToast("Введите название!", true); return; }
    if (!image) { showToast("Введите URL картинки!", true); return; }
    if (!currentFlavors.length) { showToast("Добавьте вариант!", true); return; }
    if (!currentCategory) { showToast("Выберите категорию!", true); return; }

    const categoryName = categories.find(c => c.file === currentCategory)?.name || currentCategory;

    if (editId) {
        const product = currentProducts.find(p => p.id === editId);
        product.name = name;
        product.image = image;
        product.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete product.flavors;
            product.price = currentFlavors[0].price;
            product.stock = currentFlavors[0].stock;
        } else {
            product.flavors = currentFlavors.filter(f => f.name.trim());
            delete product.price;
            delete product.stock;
        }
    } else {
        const newId = Math.max(...currentProducts.map(p => p.id), 0) + 1;
        const newProduct = {
            id: newId,
            name: name,
            category: categoryName,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        currentProducts.push(newProduct);
    }

    await saveToJsonBin();
    cancelEdit();
    await loadProducts();
    showToast("✅ Товар сохранён!", false);
}

async function deleteProduct(id) {
    if (!confirm("🗑️ Точно удалить товар?")) return;
    currentProducts = currentProducts.filter(p => p.id !== id);
    await saveToJsonBin();
    await loadProducts();
    if (editId === id) cancelEdit();
    showToast("✅ Товар удалён!", false);
}

function cancelEdit() {
    editId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Добавить товар';
    document.getElementById('productName').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('flavorsBlock').innerHTML = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
}

document.getElementById('productImage').addEventListener('input', function() {
    if (this.value) showPreview(this.value);
    else document.getElementById('imagePreview').innerHTML = '';
});

document.getElementById('clearStatsBtn')?.addEventListener('click', clearStatistics);

window.addFlavor = addFlavor;
window.removeFlavor = removeFlavor;
window.saveProduct = saveProduct;
window.deleteProduct = deleteProduct;
window.editProduct = editProduct;
window.cancelEdit = cancelEdit;
window.login = login;
window.uploadFromGallery = uploadFromGallery;
</script>
