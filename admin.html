<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель ICESHOP39</title>
    <style>
        body { background: #0A0F1E; color: white; font-family: system-ui; padding: 20px; }
        .box { max-width: 400px; margin: 100px auto; background: #111827; padding: 30px; border-radius: 20px; text-align: center; }
        .box input { width: 100%; padding: 12px; margin: 15px 0; background: #1E293B; border: 1px solid #333; border-radius: 10px; color: white; font-size: 16px; }
        .box button { background: #3B82F6; color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        .panel { display: none; max-width: 1200px; margin: 0 auto; }
        .category-btn { display: inline-block; background: #1E293B; padding: 10px 20px; margin: 5px; border-radius: 30px; cursor: pointer; }
        .category-btn.active { background: #3B82F6; }
        .product-form { background: #111827; padding: 20px; border-radius: 20px; margin: 20px 0; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #1E293B; border: 1px solid #333; border-radius: 8px; color: white; }
        .image-upload-area { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
        .image-upload-area input { flex: 1; margin: 0; }
        .image-upload-area button { background: #334155; width: auto; padding: 10px 15px; margin: 0; }
        .image-preview { margin-top: 10px; }
        .image-preview img { max-width: 100px; max-height: 100px; border-radius: 10px; }
        .flavor-item { background: #1E293B; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .flavor-item input { flex: 1; margin: 0; }
        button.danger { background: #EF4444; width: auto; }
        button.success { background: #10B981; width: auto; }
        .product-card { background: #111827; padding: 15px; margin: 10px 0; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10B981; padding: 12px 24px; border-radius: 10px; z-index: 1000; }
        .hidden { display: none; }
        @media (max-width: 700px) { .flavor-item { flex-direction: column; } }
    </style>
</head>
<body>

<!-- Вход -->
<div id="loginBox" class="box">
    <h2>🔐 Админ-панель</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p style="margin-top:15px; font-size:12px;">Пароль: admin123</p>
</div>

<!-- Админ панель -->
<div id="adminPanel" class="panel">
    <h1>🛠️ Управление товарами ICESHOP39</h1>
    
    <div id="categoriesBlock"></div>
    
    <div class="product-form">
        <h3 id="formTitle">➕ Добавить товар</h3>
        <input type="text" id="productName" placeholder="Название товара">
        
        <!-- Поле для изображения с выбором из галереи -->
        <div class="image-upload-area">
            <input type="text" id="productImage" placeholder="URL картинки или выберите фото">
            <button onclick="uploadFromGallery()">📱 Выбрать фото</button>
        </div>
        <div class="image-preview" id="imagePreview"></div>
        
        <textarea id="productDesc" placeholder="Описание товара" rows="2"></textarea>
        
        <div id="flavorsBlock"></div>
        <button onclick="addFlavor()" style="background:#334155; width:auto;">+ Добавить вариант (цвет/вкус)</button>
        
        <div style="margin-top:15px;">
            <button class="success" onclick="saveProduct()">💾 Сохранить на GitHub</button>
            <button class="danger" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Отмена</button>
        </div>
    </div>
    
    <h3>📦 Товары в категории</h3>
    <div id="productsList"></div>
</div>

<script>
// ПАРОЛЬ
const PASSWORD = "admin123";

// НАСТРОЙКИ GITHUB
const REPO_OWNER = "LoysitDeflonDon";
const REPO_NAME = "iceshop39-data";
const BRANCH = "main";

// КАТЕГОРИИ
const categories = [
    { file: "Zhitkosty", name: "Жидкости", icon: "💧" },
    { file: "Snus", name: "Снюс", icon: "👅" },
    { file: "Vapes", name: "Вейпы", icon: "💨" },
    { file: "Ispariteli", name: "Испарители", icon: "🔥" },
    { file: "Kartdritzhy", name: "Картриджи", icon: "⚡" },
    { file: "Odnorazki", name: "Одноразки", icon: "🔄" }
];

let currentCategory = null;
let currentProducts = [];
let editId = null;
let currentFlavors = [];
let githubToken = null;

// ФУНКЦИЯ ВХОДА
function login() {
    const pwd = document.getElementById('password').value;
    if (pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCategories();
        showToast("Добро пожаловать!", false);
    } else {
        alert("Неверный пароль!");
    }
}

// ЗАГРУЗКА ФОТО ИЗ ГАЛЕРЕИ ТЕЛЕФОНА
function uploadFromGallery() {
    // Создаём скрытый input для выбора файла
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.capture = 'environment'; // 'user' для фронталки, 'environment' для задней камеры
    
    fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            showToast("📤 Загрузка фото...", false);
            
            // Создаём FormData для отправки на ImgBB
            const formData = new FormData();
            formData.append('image', file);
            
            // Загружаем на ImgBB (бесплатный API)
            fetch('https://api.imgbb.com/1/upload?key=YOUR_IMGBB_API_KEY', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const imageUrl = data.data.url;
                    document.getElementById('productImage').value = imageUrl;
                    showPreview(imageUrl);
                    showToast("✅ Фото загружено! Ссылка добавлена", false);
                } else {
                    showToast("❌ Ошибка загрузки фото", true);
                }
            })
            .catch(error => {
                console.error(error);
                showToast("❌ Ошибка загрузки фото", true);
            });
        }
    };
    
    fileInput.click();
}

function showPreview(url) {
    const preview = document.getElementById('imagePreview');
    preview.innerHTML = `<img src="${url}" alt="preview" onerror="this.style.display='none'">`;
}

function updatePreview() {
    const url = document.getElementById('productImage').value;
    if (url) {
        showPreview(url);
    } else {
        document.getElementById('imagePreview').innerHTML = '';
    }
}

function showToast(msg, isError) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastMsg';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.background = isError ? '#EF4444' : '#10B981';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// КАТЕГОРИИ
function loadCategories() {
    const container = document.getElementById('categoriesBlock');
    container.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('span');
        btn.className = 'category-btn';
        btn.textContent = cat.icon + ' ' + cat.name;
        btn.onclick = () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat.file;
            loadProducts();
            cancelEdit();
        };
        container.appendChild(btn);
    });
}

// ЗАГРУЗКА ТОВАРОВ
async function loadProducts() {
    if (!currentCategory) return;
    document.getElementById('productsList').innerHTML = '<div>Загрузка...</div>';
    const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${currentCategory}.json`;
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Файл не найден');
        const text = await res.text();
        let clean = text.trim();
        if (clean.startsWith('\uFEFF')) clean = clean.substring(1);
        currentProducts = JSON.parse(clean);
        renderProducts();
    } catch(e) {
        currentProducts = [];
        renderProducts();
    }
}

function renderProducts() {
    const container = document.getElementById('productsList');
    if (!currentProducts.length) {
        container.innerHTML = '<div>📭 Нет товаров. Добавьте первый!</div>';
        return;
    }
    container.innerHTML = '';
    currentProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <div>
                <strong>${escapeHtml(product.name)}</strong><br>
                <small>ID: ${product.id} | ${product.flavors ? product.flavors.length + ' вариантов' : product.price + ' ₽'}</small>
                ${product.desc ? `<br><small style="color:#94A3B8;">${escapeHtml(product.desc.substring(0, 50))}...</small>` : ''}
            </div>
            <div>
                <button onclick="editProduct(${product.id})">✏️</button>
                <button class="danger" onclick="deleteProduct(${product.id})">🗑️</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// РЕДАКТИРОВАНИЕ
function editProduct(id) {
    const product = currentProducts.find(p => p.id === id);
    if (!product) return;
    
    editId = id;
    document.getElementById('formTitle').textContent = '✏️ Редактировать товар';
    document.getElementById('productName').value = product.name;
    document.getElementById('productImage').value = product.image || '';
    document.getElementById('productDesc').value = product.desc || '';
    if (product.image) showPreview(product.image);
    else document.getElementById('imagePreview').innerHTML = '';
    
    if (product.flavors) {
        currentFlavors = JSON.parse(JSON.stringify(product.flavors));
    } else {
        currentFlavors = [{ name: "Стандарт", price: product.price || 0, stock: product.stock || 0 }];
    }
    renderFlavors();
    document.getElementById('cancelBtn').style.display = 'inline-block';
}

// ВАРИАНТЫ
function addFlavor() {
    currentFlavors.push({ name: "", price: 0, stock: 0 });
    renderFlavors();
}

function renderFlavors() {
    const container = document.getElementById('flavorsBlock');
    if (!currentFlavors.length) {
        container.innerHTML = '<div style="padding:10px;">Нет вариантов. Нажмите "+"</div>';
        return;
    }
    container.innerHTML = '';
    currentFlavors.forEach((flavor, idx) => {
        const div = document.createElement('div');
        div.className = 'flavor-item';
        div.innerHTML = `
            <input type="text" placeholder="Название (цвет/вкус)" value="${escapeHtml(flavor.name)}" data-idx="${idx}" data-field="name" style="flex:2;">
            <input type="number" placeholder="Цена" value="${flavor.price}" data-idx="${idx}" data-field="price" style="width:120px;">
            <input type="number" placeholder="Остаток" value="${flavor.stock}" data-idx="${idx}" data-field="stock" style="width:120px;">
            <button class="danger" onclick="removeFlavor(${idx})">❌</button>
        `;
        container.appendChild(div);
    });
    
    document.querySelectorAll('#flavorsBlock input').forEach(inp => {
        inp.onchange = function() {
            const idx = parseInt(this.dataset.idx);
            const field = this.dataset.field;
            const val = this.type === 'number' ? parseInt(this.value) : this.value;
            if (!isNaN(idx)) currentFlavors[idx][field] = val;
        };
    });
}

function removeFlavor(idx) {
    currentFlavors.splice(idx, 1);
    renderFlavors();
}

// СОХРАНЕНИЕ НА GITHUB
async function saveProduct() {
    const name = document.getElementById('productName').value.trim();
    const image = document.getElementById('productImage').value.trim();
    const desc = document.getElementById('productDesc').value;
    
    if (!name) { showToast("Введите название!", true); return; }
    if (!image) { showToast("Введите URL картинки или выберите фото!", true); return; }
    if (!currentFlavors.length) { showToast("Добавьте вариант!", true); return; }
    if (!currentCategory) { showToast("Выберите категорию!", true); return; }
    
    if (!githubToken) {
        githubToken = prompt("🔐 Введите GitHub токен:\n(Создай на github.com/settings/tokens, выбери repo)");
        if (!githubToken) { showToast("Токен обязателен!", true); return; }
    }
    
    const categoryName = categories.find(c => c.file === currentCategory)?.name || currentCategory;
    
    if (editId) {
        const product = currentProducts.find(p => p.id === editId);
        product.name = name;
        product.image = image;
        product.desc = desc;
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            delete product.flavors;
            product.price = currentFlavors[0].price;
            product.stock = currentFlavors[0].stock;
        } else {
            product.flavors = currentFlavors.filter(f => f.name.trim());
            delete product.price;
            delete product.stock;
        }
    } else {
        const newId = Math.max(...currentProducts.map(p => p.id), 0) + 1;
        const newProduct = {
            id: newId,
            name: name,
            category: categoryName,
            image: image,
            desc: desc
        };
        if (currentFlavors.length === 1 && currentFlavors[0].name === "Стандарт") {
            newProduct.price = currentFlavors[0].price;
            newProduct.stock = currentFlavors[0].stock;
        } else {
            newProduct.flavors = currentFlavors.filter(f => f.name.trim());
        }
        currentProducts.push(newProduct);
    }
    
    await saveToGitHub(currentProducts);
    cancelEdit();
    loadProducts();
    showToast("✅ Товар сохранён! Через 1 минуту появится на сайте", false);
}

async function saveToGitHub(products) {
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentCategory}.json`;
    let sha = "";
    try {
        const getRes = await fetch(url, {
            headers: { 'Authorization': `token ${githubToken}` }
        });
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }
    } catch(e) {}
    
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 4))));
    const body = {
        message: editId ? `Update ${currentCategory}.json` : `Add product to ${currentCategory}.json`,
        content: content,
        branch: BRANCH
    };
    if (sha) body.sha = sha;
    
    const res = await fetch(url, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${githubToken}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });
    
    if (!res.ok) {
        const err = await res.json();
        if (err.message === "Bad credentials") {
            githubToken = null;
            showToast("Токен недействителен!", true);
        }
        throw new Error(err.message);
    }
}

async function deleteProduct(id) {
    if (!confirm("Удалить товар?")) return;
    if (!githubToken) {
        githubToken = prompt("Введите GitHub токен:");
        if (!githubToken) return;
    }
    currentProducts = currentProducts.filter(p => p.id !== id);
    await saveToGitHub(currentProducts);
    loadProducts();
    showToast("🗑️ Товар удалён", false);
}

function cancelEdit() {
    editId = null;
    currentFlavors = [];
    document.getElementById('formTitle').textContent = '➕ Добавить товар';
    document.getElementById('productName').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('flavorsBlock').innerHTML = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
}

// При изменении URL вручную показываем превью
document.getElementById('productImage').addEventListener('input', function() {
    if (this.value) showPreview(this.value);
    else document.getElementById('imagePreview').innerHTML = '';
});

// Глобальные функции
window.addFlavor = addFlavor;
window.removeFlavor = removeFlavor;
window.saveProduct = saveProduct;
window.deleteProduct = deleteProduct;
window.editProduct = editProduct;
window.cancelEdit = cancelEdit;
window.login = login;
window.uploadFromGallery = uploadFromGallery;
</script>
</body>
</html>
