<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ICESHOP39 — Вейпы, жидкости, испарители, картриджи, снюс, одноразки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0A0F1E;
            color: #EDF2FF;
            overflow-x: hidden;
        }
        :root {
            --bg-deep: #0A0F1E;
            --card-dark: #111827;
            --blue-accent: #3B82F6;
            --border-dim: #1F2A44;
            --text-secondary: #94A3B8;
        }
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-image: url('https://i.ibb.co/5hYz909b/istockphoto-1399967405-612x612.jpg');
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(3px);
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }
        .hero-title {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 900;
            color: #2563EB;
            text-shadow: 0 0 8px #1D4ED8;
        }
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            cursor: pointer;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }
        .header {
            background: rgba(10, 15, 30, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-dim);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .header.visible { transform: translateY(0); }
        .logo h2 {
            color: #3B82F6;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .categories-section {
            padding: 50px 20px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .categories-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 550px) {
            .categories-grid { grid-template-columns: 1fr; }
        }
        .category-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 28px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            opacity: 0.3;
            filter: blur(2px);
            z-index: 0;
        }
        .category-card[data-category="Жидкости"]::before { background-image: url('https://i.ibb.co/ZRJWzFgY/i.webp'); }
        .category-card[data-category="Снюс"]::before { background-image: url('https://i.ibb.co/kgQk6Rp7/2026-04-04-124535497.png'); }
        .category-card > * { position: relative; z-index: 1; }
        .category-icon { font-size: 3rem; }
        .category-name { font-weight: 700; margin: 10px 0; }
        .category-card:hover { transform: translateY(-5px); border-color: var(--blue-accent); }
        .products-page, .flavors-page {
            display: none;
            padding: 90px 20px 50px;
        }
        .products-page.active, .flavors-page.active {
            display: block;
        }
        .back-home {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card, .flavor-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .product-card:hover, .flavor-card:hover {
            transform: translateY(-5px);
            border-color: var(--blue-accent);
        }
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 18px;
        }
        .product-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #FACC15;
        }
        .flavor-stock {
            font-size: 0.9rem;
            color: #94A3B8;
            margin-top: 8px;
        }
        .stock-low {
            color: #EF4444;
        }
        .managers-section {
            padding: 40px 20px;
            border-top: 1px solid var(--border-dim);
        }
        .managers-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .manager-card {
            background: var(--card-dark);
            border-radius: 60px;
            padding: 12px 24px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .manager-card:hover {
            background: var(--blue-accent);
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #4B5563;
            border-top: 1px solid var(--border-dim);
        }
        .loader {
            text-align: center;
            padding: 50px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-dark);
            border-radius: 24px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-dim);
        }
        th {
            background: #1E293B;
        }
    </style>
</head>
<body>
<div class="header" id="header"><div class="logo" id="homeLogoBtn"><h2>ICESHOP39</h2></div></div>

<div id="mainPage">
    <div class="hero-section"><div class="hero-content"><div class="hero-title">ICESHOP39</div><div class="hero-desc" style="color:#94A3B8">Вейпы · Жидкости · Испарители · Картриджи · Снюс · Одноразки</div></div><div class="scroll-hint" id="scrollHint">↓ Листай ↓</div></div>
    <div class="categories-section"><h2 class="section-title" style="text-align:center">📦 Категории</h2><div class="categories-grid" id="categoriesGrid"><div class="loader">Загрузка...</div></div></div>
</div>

<div id="productsPage" class="products-page"><button class="back-home" id="backHomeBtn">← На главную</button><h2 class="page-title" id="productsPageTitle" style="text-align:center"></h2><div class="products-grid" id="productsContainer"></div></div>

<div id="flavorsPage" class="flavors-page"><button class="back-home" id="backFlavorsHomeBtn">← Назад к категориям</button><h2 class="page-title" id="flavorsPageTitle" style="text-align:center"></h2><div id="flavorsContainer"></div></div>

<div class="managers-section"><h3 style="text-align:center">📱 Наши менеджеры</h3><div class="managers-grid"><a href="https://t.me/ICE_SHOP39" class="manager-card">🏢 КСиПТ</a><a href="https://t.me/IceShop_Gur" class="manager-card">🏘️ Гурьевск</a><a href="https://t.me/IceShop_KLND" class="manager-card">🌆 Калининград</a></div></div>
<footer>⚡ ICESHOP39. Продажа только совершеннолетним. 2026</footer>

<script>
    const categories = [
        { id: "Жидкости", name: "Жидкости", icon: "💧" },
        { id: "Испарители", name: "Испарители", icon: "🔥" },
        { id: "Картриджи", name: "Картриджи", icon: "⚡" },
        { id: "Вейпы", name: "Вейпы", icon: "💨" },
        { id: "Снюс", name: "Снюс", icon: "👅" },
        { id: "Одноразки", name: "Одноразки", icon: "🔄" }
    ];

    let products = []; // обычные товары
    let flavors = [];  // { parentName, parentCategory, flavorName, price, stock }

    let currentCategory = null;
    let currentFlavorParent = null;

    async function loadData() {
        const url = 'https://raw.githubusercontent.com/LoysitDeflonDon/iceshop39-data/refs/heads/main/products.json';
        try {
            const res = await fetch(url);
            const data = await res.json();
            
            // Разделяем: обычные товары и многовариантные (жидкости/снюс)
            products = data.filter(item => !item.flavors);
            flavors = [];
            data.forEach(item => {
                if (item.flavors && Array.isArray(item.flavors)) {
                    item.flavors.forEach(f => {
                        flavors.push({
                            parentId: item.id,
                            parentName: item.name,
                            parentCategory: item.category,
                            parentImage: item.image,
                            flavorName: f.name,
                            price: f.price,
                            stock: f.stock
                        });
                    });
                }
            });
            renderCategories();
        } catch(e) {
            console.error(e);
            document.getElementById('categoriesGrid').innerHTML = '<div class="loader">Ошибка загрузки</div>';
        }
    }

    function getCount(catName) {
        if (catName === "Жидкости" || catName === "Снюс") {
            const parents = products.filter(p => p.category === catName && p.flavors);
            return parents.length;
        }
        return products.filter(p => p.category === catName).length;
    }

    function renderCategories() {
        const container = document.getElementById('categoriesGrid');
        container.innerHTML = categories.map(cat => `
            <div class="category-card" data-category="${cat.name}">
                <div class="category-icon">${cat.icon}</div>
                <div class="category-name">${cat.name}</div>
                <div class="category-count">${getCount(cat.name)} товаров</div>
            </div>
        `).join('');
        document.querySelectorAll('.category-card').forEach(card => {
            card.addEventListener('click', () => openCategory(card.dataset.category));
        });
    }

    function openCategory(catName) {
        currentCategory = catName;
        if (catName === "Жидкости" || catName === "Снюс") {
            // Показываем родительские карточки (без вкусов)
            const filtered = products.filter(p => p.category === catName && p.flavors);
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('productsPage').classList.add('active');
            document.getElementById('productsPageTitle').innerText = catName;
            const container = document.getElementById('productsContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-msg">Нет позиций</div>';
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="product-card" data-parent-id="${p.id}">
                    <img class="product-image" src="${p.image}" onerror="this.src='https://placehold.co/400x300/1E293B/3B82F6?text=No+Image'">
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-price">от ${Math.min(...p.flavors.map(f=>f.price))} ₽</div>
                </div>
            `).join('');
            document.querySelectorAll('.product-card[data-parent-id]').forEach(card => {
                card.addEventListener('click', () => openFlavors(parseInt(card.dataset.parentId)));
            });
        } else {
            // Обычные товары
            const filtered = products.filter(p => p.category === catName && !p.flavors);
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('productsPage').classList.add('active');
            document.getElementById('productsPageTitle').innerText = catName;
            const container = document.getElementById('productsContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-msg">Нет товаров</div>';
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <img class="product-image" src="${p.image}" onerror="this.src='https://placehold.co/400x300/1E293B/3B82F6?text=No+Image'">
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <div class="product-desc">${escapeHtml(p.desc)}</div>
                </div>
            `).join('');
        }
        window.scrollTo({ top: 0 });
    }

    function openFlavors(parentId) {
        const parent = products.find(p => p.id === parentId);
        if (!parent) return;
        currentFlavorParent = parent;
        const flavorList = flavors.filter(f => f.parentId === parentId);
        document.getElementById('productsPage').classList.remove('active');
        document.getElementById('flavorsPage').classList.add('active');
        document.getElementById('flavorsPageTitle').innerText = `${parent.name} — вкусы`;
        const container = document.getElementById('flavorsContainer');
        if (flavorList.length === 0) {
            container.innerHTML = '<div class="empty-msg">Нет вкусов</div>';
            return;
        }
        container.innerHTML = `
            <table>
                <thead><tr><th>Вкус</th><th>Цена</th><th>Остаток</th></tr></thead>
                <tbody>
                    ${flavorList.map(f => `
                        <tr>
                            <td>${escapeHtml(f.flavorName)}</td>
                            <td>${f.price} ₽</td>
                            <td class="${f.stock < 5 ? 'stock-low' : ''}">${f.stock} шт</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }

    function goToHome() {
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('productsPage').classList.remove('active');
        document.getElementById('flavorsPage').classList.remove('active');
        currentCategory = null;
        window.scrollTo({ top: 0 });
    }

    document.getElementById('backHomeBtn').onclick = goToHome;
    document.getElementById('backFlavorsHomeBtn').onclick = goToHome;
    document.getElementById('homeLogoBtn').onclick = goToHome;
    document.getElementById('scrollHint').onclick = () => document.getElementById('categoriesSection').scrollIntoView({ behavior: 'smooth' });
    window.addEventListener('scroll', () => {
        const header = document.getElementById('header');
        if (window.scrollY > 100) header.classList.add('visible');
        else header.classList.remove('visible');
    });

    loadData();
</script>
</body>
</html>
