<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ICESHOP39 — Вейпы, жидкости, испарители, картриджи, снюс, одноразки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0A0F1E;
            color: #EDF2FF;
            overflow-x: hidden;
        }

        :root {
            --bg-deep: #0A0F1E;
            --card-dark: #111827;
            --blue-accent: #3B82F6;
            --border-dim: #1F2A44;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --success: #10B981;
            --danger: #EF4444;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('https://i.ibb.co/5hYz909b/istockphoto-1399967405-612x612.jpg');
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(3px);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-title {
            font-size: clamp(2.5rem, 10vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #2563EB;
            display: inline-block;
            user-select: none;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUpFade 0.8s ease forwards;
            text-shadow: 0 0 4px #1D4ED8, 0 0 8px #1E3A8A, 0 0 12px #172554;
            transition: text-shadow 0.3s ease;
        }

        .hero-title:hover {
            text-shadow: 0 0 6px #3B82F6, 0 0 12px #2563EB, 0 0 18px #1D4ED8, 0 0 24px #1E3A8A;
        }

        @keyframes slideUpFade {
            to { transform: translateY(0); opacity: 1; }
        }

        .hero-desc {
            font-size: clamp(1rem, 5vw, 1.5rem);
            color: var(--text-secondary);
            margin-top: 20px;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUpFade 0.8s ease 0.4s forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: var(--text-secondary);
            animation: bounce 2s infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        .header {
            background: rgba(10, 15, 30, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-dim);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .header.visible {
            transform: translateY(0);
        }

        .logo {
            cursor: pointer;
            position: relative;
        }

        .logo h2 {
            font-size: clamp(1rem, 5vw, 1.5rem);
            color: #3B82F6;
            text-shadow: 0 0 3px #1D4ED8, 0 0 5px #1E3A8A;
            font-weight: 800;
        }

        .logo::after {
            content: "Главная";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--blue-accent);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            transition-delay: 0s;
            pointer-events: none;
        }

        .logo:hover::after {
            opacity: 1;
            transition-delay: 1.5s;
        }

        .categories-section {
            padding: 50px 20px;
            background: var(--bg-deep);
        }

        .section-title {
            text-align: center;
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 30px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }

        .category-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 28px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.35;
            filter: blur(2px);
            transition: opacity 0.3s;
            z-index: 0;
        }

        .category-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
            pointer-events: none;
        }

        .category-card[data-category="Жидкости"]::before {
            background-image: url('https://i.ibb.co/ZRJWzFgY/i.webp');
        }
        .category-card[data-category="Испарители"]::before {
            background-image: url('https://i.ibb.co/xKG5BxjK/2026-04-04-124034203.png');
        }
        .category-card[data-category="Картриджи"]::before {
            background-image: url('https://i.ibb.co/k284RcWN/2026-04-04-123830912.png');
        }
        .category-card[data-category="Вейпы"]::before {
            background-image: url('https://i.ibb.co/3Xgr0v8/2026-04-04-124326975.png');
        }
        .category-card[data-category="Снюс"]::before {
            background-image: url('https://i.ibb.co/kgQk6Rp7/2026-04-04-124535497.png');
        }
        .category-card[data-category="Одноразки"]::before {
            background-image: url('https://i.ibb.co/W4hXLFkr/2026-04-04-124758580.png');
        }

        .category-card:hover::before {
            opacity: 0.5;
        }

        .category-card > * {
            position: relative;
            z-index: 2;
        }

        .category-icon {
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 15px;
        }

        .category-name {
            font-size: clamp(1rem, 5vw, 1.3rem);
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .category-count {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .category-card:hover {
            transform: translateY(-8px);
            border-color: var(--blue-accent);
        }

        .products-page, .flavors-page {
            display: none;
            padding: 90px 20px 50px;
            min-height: 100vh;
        }

        .products-page.active, .flavors-page.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .back-home {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 40px;
            padding: 8px 20px;
            color: white;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home:hover {
            background: var(--blue-accent);
            transform: translateX(-5px);
        }

        .page-title {
            font-size: clamp(1.5rem, 6vw, 2rem);
            margin-bottom: 25px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 16px;
            transition: all 0.4s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--blue-accent);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 18px;
            background: #1E293B;
        }

        .product-title {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 700;
        }

        .product-price {
            font-size: clamp(1.3rem, 5vw, 1.7rem);
            font-weight: 800;
            color: #FACC15;
        }

        .product-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .order-pill {
            background: var(--success);
            border: none;
            border-radius: 60px;
            padding: 12px 20px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            width: 100%;
            text-align: center;
        }

        .order-pill:hover {
            background: #059669;
            transform: scale(1.02);
        }

        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 20px;
            font-size: 1rem;
        }

        /* Стили для страницы вкусов — без горизонтального скролла */
        .flavors-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .flavor-item {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .flavor-name {
            font-weight: 600;
            flex: 2;
            min-width: 120px;
            word-break: break-word;
        }
        .flavor-price {
            color: #FACC15;
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 70px;
        }
        .flavor-stock {
            min-width: 80px;
            font-size: 0.85rem;
        }
        .stock-low {
            color: #EF4444;
            font-weight: 600;
        }
        .flavor-order-btn {
            background: var(--success);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .flavor-order-btn:hover {
            background: #059669;
        }

        @media (max-width: 550px) {
            .flavor-item {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .flavor-name, .flavor-price, .flavor-stock {
                text-align: center;
            }
            .flavor-order-btn {
                margin-top: 5px;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1E293B;
            border: 1px solid var(--border-dim);
            border-radius: 32px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .manager-option {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 60px;
            padding: 12px;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .manager-option:hover {
            background: var(--blue-accent);
        }
        .cancel-modal {
            background: #334155;
            border: none;
            border-radius: 60px;
            padding: 10px;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: 600;
        }

        .managers-section {
            padding: 50px 20px 30px;
            background: var(--bg-deep);
            border-top: 1px solid var(--border-dim);
        }
        .managers-title {
            text-align: center;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            margin-bottom: 30px;
        }
        .managers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        @media (max-width: 700px) {
            .managers-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
        .manager-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dim);
            border-radius: 60px;
            padding: 14px 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            transition: 0.3s;
        }
        .manager-card:hover {
            background: var(--blue-accent);
            transform: translateY(-3px);
        }
        footer {
            text-align: center;
            padding: 25px 20px;
            color: #4B5563;
            border-top: 1px solid var(--border-dim);
            font-size: 0.8rem;
        }
        .loader {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="header" id="header">
    <div class="logo" id="homeLogoBtn">
        <h2>ICESHOP39</h2>
    </div>
</div>

<div id="mainPage">
    <div class="hero-section">
        <div class="hero-content">
            <div class="hero-title">ICESHOP39</div>
            <div class="hero-desc">🔥 Вейпы · Жидкости · Испарители · Картриджи · Снюс · Одноразки 🔥</div>
        </div>
        <div class="scroll-hint" id="scrollHint">↓ Листай вниз ↓</div>
    </div>
    <div class="categories-section" id="categoriesSection">
        <h2 class="section-title">📦 Категории</h2>
        <div class="categories-grid" id="categoriesGrid"><div class="loader">Загрузка...</div></div>
    </div>
</div>

<div id="productsPage" class="products-page">
    <button class="back-home" id="backHomeBtn">← Назад</button>
    <h2 class="page-title" id="productsPageTitle"></h2>
    <div class="products-grid" id="productsContainer"></div>
</div>

<div id="flavorsPage" class="flavors-page">
    <button class="back-home" id="backFlavorsHomeBtn">← Назад</button>
    <h2 class="page-title" id="flavorsPageTitle"></h2>
    <div id="flavorsContainer"></div>
</div>

<div id="managerModal" class="modal">
    <div class="modal-content">
        <h3>📱 Выберите менеджера</h3>
        <div id="managerOptions"></div>
        <button class="cancel-modal" id="cancelModalBtn">Отмена</button>
    </div>
</div>

<div class="managers-section">
    <h3 class="managers-title">📱 Наши менеджеры в городах</h3>
    <div class="managers-grid">
        <a href="https://t.me/ICE_SHOP39" target="_blank" class="manager-card"><span>🏢</span> КСиПТ</a>
        <a href="https://t.me/IceShop_Gur" target="_blank" class="manager-card"><span>🏘️</span> Гурьевск</a>
        <a href="https://t.me/IceShop_KLND" target="_blank" class="manager-card"><span>🌆</span> Калининград</a>
    </div>
</div>

<footer>⚡ ICESHOP39. Все права защищены. Продажа только совершеннолетним. 2026</footer>

<script>
    // СООТВЕТСТВИЕ КАТЕГОРИЙ → JSON-ФАЙЛАМ
    const categoryFiles = {
        "Жидкости": "zhidkosti.json",
        "Снюс": "snus.json",
        "Вейпы": "veypy.json",
        "Испарители": "ispariteli.json",
        "Картриджи": "kartridzhi.json",
        "Одноразки": "odnorazki.json"
    };

    const categories = [
        { id: "Жидкости", name: "Жидкости", icon: "💧" },
        { id: "Снюс", name: "Снюс", icon: "👅" },
        { id: "Вейпы", name: "Вейпы", icon: "💨" },
        { id: "Испарители", name: "Испарители", icon: "🔥" },
        { id: "Картриджи", name: "Картриджи", icon: "⚡" },
        { id: "Одноразки", name: "Одноразки", icon: "🔄" }
    ];

    const managers = [
        { name: "КСиПТ", tg: "ICE_SHOP39" },
        { name: "Гурьевск", tg: "IceShop_Gur" },
        { name: "Калининград", tg: "IceShop_KLND" }
    ];

    let allItems = {};      // { "Жидкости": [...], "Вейпы": [...] }
    let currentCategory = null;

    function formatStock(stock) {
        if (stock === undefined || stock === null) return { text: "Нет в наличии", isOutOfStock: true };
        if (typeof stock === "number") {
            if (stock <= 0) return { text: "Нет в наличии", isOutOfStock: true };
            if (stock < 5) return { text: stock + " шт", isLow: true, isOutOfStock: false };
            return { text: stock + " шт", isOutOfStock: false };
        }
        if (typeof stock === "string") {
            if (stock.toLowerCase() === "нет в наличии" || stock === "0") {
                return { text: "Нет в наличии", isOutOfStock: true };
            }
            const num = parseInt(stock);
            if (!isNaN(num)) {
                if (num <= 0) return { text: "Нет в наличии", isOutOfStock: true };
                if (num < 5) return { text: num + " шт", isLow: true, isOutOfStock: false };
                return { text: num + " шт", isOutOfStock: false };
            }
            return { text: stock, isOutOfStock: true };
        }
        return { text: "Нет в наличии", isOutOfStock: true };
    }

    function showManagerModal(productName, variant, price, callback) {
        const modal = document.getElementById('managerModal');
        const optionsContainer = document.getElementById('managerOptions');
        optionsContainer.innerHTML = managers.map(m => `
            <div class="manager-option" data-tg="${m.tg}">
                <span>${m.name === "КСиПТ" ? "🏢" : m.name === "Гурьевск" ? "🏘️" : "🌆"}</span>
                <span>${m.name}</span>
            </div>
        `).join('');
        modal.style.display = 'flex';
        document.querySelectorAll('.manager-option').forEach(opt => {
            opt.addEventListener('click', () => {
                modal.style.display = 'none';
                callback(opt.dataset.tg);
            });
        });
    }

    function closeModal() {
        document.getElementById('managerModal').style.display = 'none';
    }

    function orderViaTelegram(productName, variant, price, managerTg) {
        const message = `Здравствуйте! Хочу заказать: ${productName}, ${variant} — ${price} ₽`;
        window.open(`https://t.me/${managerTg}?text=${encodeURIComponent(message)}`, '_blank');
    }

    async function loadCategory(categoryName) {
        const fileName = categoryFiles[categoryName];
        if (!fileName) return [];
        const url = `https://raw.githubusercontent.com/LoysitDeflonDon/iceshop39-data/main/${fileName}`;
        try {
            const res = await fetch(url);
            if (!res.ok) return [];
            return await res.json();
        } catch(e) {
            console.error(`Ошибка загрузки ${categoryName}:`, e);
            return [];
        }
    }

    async function loadAllData() {
        const promises = categories.map(async cat => {
            const data = await loadCategory(cat.name);
            allItems[cat.name] = data;
        });
        await Promise.all(promises);
        renderCategories();
    }

    function getCount(catName) {
        const items = allItems[catName] || [];
        return items.length;
    }

    function renderCategories() {
        const container = document.getElementById("categoriesGrid");
        container.innerHTML = categories.map(cat => `
            <div class="category-card" data-category="${cat.name}">
                <div class="category-icon">${cat.icon}</div>
                <div class="category-name">${cat.name}</div>
                <div class="category-count">${getCount(cat.name)} товаров</div>
            </div>
        `).join('');
        document.querySelectorAll('.category-card').forEach(card => {
            card.addEventListener('click', () => openCategory(card.dataset.category));
        });
    }

    function openCategory(catName) {
        currentCategory = catName;
        const items = allItems[catName] || [];
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('productsPage').classList.add('active');
        document.getElementById('productsPageTitle').textContent = catName;
        const container = document.getElementById('productsContainer');
        if (!items.length) { container.innerHTML = '<div class="empty-msg">📭 Товары отсутствуют.</div>'; return; }
        
        container.innerHTML = items.map(item => {
            // Если у товара есть flavors → НЕТ кнопки "Заказать" на карточке
            if (item.flavors && item.flavors.length > 0) {
                return `
                    <div class="product-card" data-id="${item.id}" data-has-flavors="true">
                        <img class="product-image" src="${item.image}" onerror="this.src='https://placehold.co/400x300/1E293B/3B82F6?text=No+Image'">
                        <div class="product-title">${escapeHtml(item.name)}</div>
                        <div class="product-price">от ${Math.min(...item.flavors.map(f => f.price))} ₽</div>
                    </div>
                `;
            } else {
                // Обычный товар — кнопка "Заказать" есть
                return `
                    <div class="product-card" data-id="${item.id}" data-has-flavors="false">
                        <img class="product-image" src="${item.image}" onerror="this.src='https://placehold.co/400x300/1E293B/3B82F6?text=No+Image'">
                        <div class="product-title">${escapeHtml(item.name)}</div>
                        <div class="product-price">${item.price} ₽</div>
                        <div class="product-desc">${escapeHtml(item.desc || '')}</div>
                        <button class="order-pill" data-order-type="simple" data-order-name="${escapeHtml(item.name)}" data-order-price="${item.price}">📦 Заказать</button>
                    </div>
                `;
            }
        }).join('');
        
        // Обработка кнопок заказа для обычных товаров
        document.querySelectorAll('.order-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const name = btn.dataset.orderName;
                const price = btn.dataset.orderPrice;
                showManagerModal(name, 'стандарт', price, (tg) => orderViaTelegram(name, 'стандарт', price, tg));
            });
        });
        
        // Обработка кликов по карточкам товаров с flavors
        document.querySelectorAll('.product-card').forEach(card => {
            const hasFlavors = card.dataset.hasFlavors === 'true';
            if (hasFlavors) {
                const id = parseInt(card.dataset.id);
                const item = items.find(i => i.id === id);
                if (item && item.flavors) {
                    card.addEventListener('click', () => openFlavors(item));
                }
            }
        });
        
        window.scrollTo({ top: 0 });
    }

    function openFlavors(parentItem) {
        document.getElementById('productsPage').classList.remove('active');
        document.getElementById('flavorsPage').classList.add('active');
        document.getElementById('flavorsPageTitle').textContent = `${parentItem.name} — все варианты`;
        const container = document.getElementById('flavorsContainer');
        
        if (!parentItem.flavors || parentItem.flavors.length === 0) {
            container.innerHTML = '<div class="empty-msg">📭 Список вариантов пуст.</div>';
            return;
        }
        
        container.innerHTML = `
            <div class="flavors-list">
                ${parentItem.flavors.map(f => {
                    const stockInfo = formatStock(f.stock);
                    const stockClass = stockInfo.isOutOfStock ? 'stock-low' : (stockInfo.isLow ? 'stock-low' : '');
                    const stockText = stockInfo.text;
                    return `
                        <div class="flavor-item">
                            <span class="flavor-name">${escapeHtml(f.name)}</span>
                            <span class="flavor-price">${f.price} ₽</span>
                            <span class="flavor-stock ${stockClass}">${stockText}</span>
                            <button class="flavor-order-btn" data-flavor-name="${escapeHtml(f.name)}" data-flavor-price="${f.price}" ${stockInfo.isOutOfStock ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>📦 Заказать</button>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        
        document.querySelectorAll('.flavor-order-btn').forEach(btn => {
            if (btn.disabled) return;
            btn.addEventListener('click', () => {
                const name = btn.dataset.flavorName;
                const price = btn.dataset.flavorPrice;
                showManagerModal(parentItem.name, name, price, (tg) => orderViaTelegram(parentItem.name, name, price, tg));
            });
        });
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }
    
    function goToHome() {
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('productsPage').classList.remove('active');
        document.getElementById('flavorsPage').classList.remove('active');
        window.scrollTo({ top: 0 });
    }
    
    function goBackToCategory() {
        document.getElementById('flavorsPage').classList.remove('active');
        document.getElementById('productsPage').classList.add('active');
        if (currentCategory) openCategory(currentCategory);
    }
    
    function handleScroll() {
        const header = document.getElementById('header');
        if (window.scrollY > 100) header.classList.add('visible');
        else header.classList.remove('visible');
    }

    document.getElementById('backHomeBtn').onclick = goToHome;
    document.getElementById('backFlavorsHomeBtn').onclick = goBackToCategory;
    document.getElementById('homeLogoBtn').onclick = goToHome;
    document.getElementById('scrollHint').onclick = () => document.getElementById('categoriesSection').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('cancelModalBtn').onclick = closeModal;
    window.onclick = (e) => { if (e.target === document.getElementById('managerModal')) closeModal(); };
    window.addEventListener('scroll', handleScroll);

    loadAllData();
    handleScroll();
</script>
</body>
</html>
