<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <style>
        body { background: #0A0F1E; color: white; font-family: system-ui; padding: 20px; }
        .box { max-width: 300px; margin: 100px auto; background: #111; padding: 20px; border-radius: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; }
        button { background: #3B82F6; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div id="loginBox" class="box">
    <h2>Вход</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="checkPassword()">Войти</button>
</div>

<div id="adminPanel" style="display:none;">
    <h1>Админка работает!</h1>
    <p>Ты вошёл!</p>
</div>

<script>
function checkPassword() {
    var pwd = document.getElementById('password').value;
    if (pwd === 'admin123') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
    } else {
        alert('Неверный пароль!');
    }
}
</script>
</body>
</html>
